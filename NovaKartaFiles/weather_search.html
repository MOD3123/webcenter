<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<title>Počasie + Vyhľadávanie + Kalkulačka</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
  /* ── Dark mode (default) ── */
  :root {
    --primary:        #07630f;
    --primary-hover:  #0b4c10;
    --on-primary:     #ffffff;

    --surf-field:     #252525;
    --surf-field-foc: #2c2c2c;
    --on-surf:        #f0f0f0;
    --outline:        #888888;
    --out-var:        rgba(255,255,255,0.13);

    --sug-bg:         #1e1e1e;
    --sug-hover:      #2d2d2d;
    --sug-border:     rgba(255,255,255,0.10);
    --sug-divider:    rgba(255,255,255,0.08);
    --sug-icon:       #888888;
    --sug-arrow:      rgba(255,255,255,0.25);

    --calc-bg:        #161616;
    --calc-border:    rgba(255,255,255,0.10);
    --calc-util-bg:   #222222;
    --calc-util-col:  rgba(255,255,255,0.65);
    --calc-util-hov:  #2e2e2e;
    --key-num-bg:     #333333;
    --key-num-col:    #f0f0f0;
    --key-num-hov:    #3e3e3e;
    --key-op-bg:      #163c19;
    --key-op-col:     #8ee898;
    --key-op-hov:     #1e5223;
    --key-fn-bg:      #252525;
    --key-fn-col:     rgba(255,255,255,0.60);
    --key-fn-hov:     #303030;

    --toggle-bg:      rgba(0,0,0,0.60);
    --toggle-hov:     rgba(0,0,0,0.80);

    --clear-hov:      rgba(255,255,255,0.10);
    --clear-hov-col:  #ffffff;

    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  /* ── Light mode ── */
  @media (prefers-color-scheme: light) {
    :root {
      --primary:        #07630f;
      --primary-hover:  #0b4c10;
      --on-primary:     #ffffff;

      --surf-field:     #efefef;
      --surf-field-foc: #e6e6e6;
      --on-surf:        #1a1a1a;
      --outline:        #777777;
      --out-var:        rgba(0,0,0,0.12);

      --sug-bg:         #ffffff;
      --sug-hover:      #f0f0f0;
      --sug-border:     rgba(0,0,0,0.10);
      --sug-divider:    rgba(0,0,0,0.07);
      --sug-icon:       #777777;
      --sug-arrow:      rgba(0,0,0,0.25);

      --calc-bg:        #f5f5f5;
      --calc-border:    rgba(0,0,0,0.10);
      --calc-util-bg:   #e8e8e8;
      --calc-util-col:  #444444;
      --calc-util-hov:  #dcdcdc;
      --key-num-bg:     #e2e2e2;
      --key-num-col:    #1a1a1a;
      --key-num-hov:    #d5d5d5;
      --key-op-bg:      #c8eacb;
      --key-op-col:     #07630f;
      --key-op-hov:     #b3deb7;
      --key-fn-bg:      #ebebeb;
      --key-fn-col:     #555555;
      --key-fn-hov:     #dcdcdc;

      --toggle-bg:      rgba(0,0,0,0.18);
      --toggle-hov:     rgba(0,0,0,0.30);

      --clear-hov:      rgba(0,0,0,0.08);
      --clear-hov-col:  #1a1a1a;
    }
  }
  .material-icons-round { font-size: 20px; line-height: 1; user-select: none; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', 'Google Sans', sans-serif;
    background: transparent;
    color: var(--on-surf);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }

  /* ── Search layout ── */
  .search-container { width: 90%; max-width: 500px; position: relative; }
  .search-wrap { position: relative; width: 100%; display: flex; flex-direction: column; }
  .search-row  { display: flex; gap: 8px; align-items: stretch; }

  /* ── search-field (kniznica style, dark) ── */
  .search-field {
    display: flex; align-items: center; gap: 10px;
    background: var(--surf-field);
    border: 1.5px solid var(--out-var);
    border-radius: 100px;
    height: 52px;
    padding: 0 6px 0 16px;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .search-field:focus-within {
    background: var(--surf-field-foc);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(7,99,15,0.18);
  }
  .search-field .sf-icon {
    font-size: 20px; line-height: 1;
    color: var(--outline);
    flex-shrink: 0;
    pointer-events: none;
    transition: color 0.2s var(--ease);
    user-select: none;
  }
  .search-field:focus-within .sf-icon { color: #4dbb58; }
  .search-field input {
    flex: 1; min-width: 0;
    border: none; outline: none;
    background: transparent;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    color: var(--on-surf);
    padding: 0;
    caret-color: var(--primary);
  }
  .search-field input::placeholder { color: var(--outline); font-size: 14px; }

  /* clear btn */
  .clear-btn {
    width: 36px; height: 36px;
    border-radius: 50%; border: none;
    background: transparent;
    color: var(--outline);
    cursor: pointer;
    display: none; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 14px;
    transition: background 0.15s var(--ease), color 0.15s;
    position: relative; overflow: hidden;
  }
  .clear-btn:hover { background: var(--clear-hov); color: var(--clear-hov-col); }
  .search-field input:not(:placeholder-shown) ~ .clear-btn { display: flex; }

  /* submit btn */
  .search-btn {
    height: 52px; width: 52px;
    border: none; border-radius: 50%;
    background: var(--primary); color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s var(--ease), box-shadow 0.15s var(--ease), transform .1s;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
    position: relative; overflow: hidden;
  }
  .search-btn:hover { background: var(--primary-hover); box-shadow: 0 2px 8px rgba(7,99,15,0.45); }
  .search-btn:active { transform: scale(0.94); }
  .search-btn .material-icons-round { font-size: 22px; pointer-events: none; }
  .search-btn::after {
    content: ''; position: absolute; inset: 0;
    background: #fff; opacity: 0; transition: opacity .15s; border-radius: inherit;
  }
  .search-btn:hover::after { opacity: .08; }

  /* ── Suggestions ── */
  .suggestions {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: var(--sug-bg);
    border: 1px solid var(--sug-border);
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.22);
    overflow: hidden; z-index: 999; overflow-y: hidden;
    display: none; flex-direction: column;
  }
  .suggestions.open { display: flex; }

  .sug-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
    font-size: 0.9375rem;
    color: var(--on-surf);
    font-family: 'Roboto', sans-serif;
    transition: background 0.1s;
    border: none; background: transparent;
    text-align: left; width: 100%;
  }
  .sug-item:hover, .sug-item.focused { background: var(--sug-hover); }
  .sug-icon  { font-size: 18px; color: var(--sug-icon); flex-shrink: 0; line-height: 1; }
  .sug-text  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug-arrow {
    font-size: 16px; color: var(--sug-arrow); flex-shrink: 0;
    transform: rotate(45deg); opacity: 0; transition: opacity 0.1s; line-height: 1;
  }
  .sug-item:hover .sug-arrow, .sug-item.focused .sug-arrow { opacity: 1; }
  .sug-divider { height: 1px; background: var(--sug-divider); margin: 0 12px; }

  /* ── Weather ── */
  .weather-frame {
    width: 90%; max-width: 600px; height: 199px;
    border: none; border-radius: 15px; background: transparent;
    transition: height 0.6s ease; overflow: hidden; margin-bottom: 0;
  }
  .weather-frame::-webkit-scrollbar { display: none; }
  .weather-frame { scrollbar-width: none; }
  .toggle-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; background: var(--toggle-bg); color: var(--on-surf);
    padding: 6px 14px; border-radius: 20px; cursor: pointer;
    font-size: 14px; font-family: 'Google Sans', sans-serif; font-weight: 500;
    transition: background .2s; z-index: 3;
  }
  .toggle-btn:hover { background: var(--toggle-hov); }
  .toggle-btn .material-icons-round { font-size: 16px; }

  /* ── Calculator keyboard — M3 Expressive compact ── */
  #advancedKeyboard {
    position: absolute;
    bottom: 58px; left: 0; right: 0;
    display: none; flex-direction: column; gap: 4px;
    background: var(--calc-bg);
    border-radius: 20px; padding: 8px 8px 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    border: 1px solid var(--calc-border);
    transform-origin: bottom center;
    animation: none;
  }
  #advancedKeyboard.show {
    display: flex;
    animation: calc-slide-in .22s cubic-bezier(0.2,0,0,1) both;
  }
  @keyframes calc-slide-in {
    from { opacity:0; transform: translateY(10px) scale(.97); }
    to   { opacity:1; transform: translateY(0)    scale(1);   }
  }

  /* top utility bar */
  #advancedKeyboard .calc-util {
    display: flex; gap: 4px; margin-bottom: 2px;
  }
  #advancedKeyboard .calc-util button {
    flex: 1; height: 32px;
    font-size: 12px; font-family: 'Google Sans', sans-serif; font-weight: 500;
    border-radius: 100px; border: none;
    background: var(--calc-util-bg); color: var(--calc-util-col);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px;
    transition: background .15s, color .15s; position: relative; overflow: hidden;
    letter-spacing: .3px;
  }
  #advancedKeyboard .calc-util button:hover { background: var(--calc-util-hov); color: var(--on-surf); }
  #advancedKeyboard .calc-util .material-icons-round { font-size: 14px; }

  /* 4-column grid */
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  /* Base key */
  #advancedKeyboard button.key {
    height: 40px; font-size: 15px;
    font-family: 'Google Sans', sans-serif; font-weight: 500;
    border-radius: 12px; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: filter .15s, transform .1s; position: relative; overflow: hidden;
    letter-spacing: -.2px;
  }
  #advancedKeyboard button.key:active { transform: scale(.92); }

  #advancedKeyboard button.key.key-num { background: var(--key-num-bg); color: var(--key-num-col); }
  #advancedKeyboard button.key.key-num:hover { background: var(--key-num-hov); }

  #advancedKeyboard button.key.key-op { background: var(--key-op-bg); color: var(--key-op-col); }
  #advancedKeyboard button.key.key-op:hover { background: var(--key-op-hov); }

  #advancedKeyboard button.key.key-fn { background: var(--key-fn-bg); color: var(--key-fn-col); font-size: 13px; }
  #advancedKeyboard button.key.key-fn:hover { background: var(--key-fn-hov); color: var(--on-surf); }

  #advancedKeyboard button.key.key-eq {
    background: var(--primary); color: var(--on-primary);
    font-size: 20px; border-radius: 16px;
    box-shadow: 0 2px 8px rgba(7,99,15,0.35);
  }
  #advancedKeyboard button.key.key-eq:hover { background: var(--primary-hover); }

  /* util-bar .key override */
  #advancedKeyboard .calc-util .key {
    height: 32px; border-radius: 100px; font-size: 13px; flex: 1;
  }

  /* Ripple */
  .ripple {
    position: absolute; border-radius: 50%;
    transform: scale(0);
    animation: ripple-anim .5s linear;
    background: rgba(0,0,0,0.12);
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .ripple { background: rgba(255,255,255,0.15); }
  }
  @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>

<!-- Weather -->
<iframe id="weather" class="weather-frame" src="https://www.imeteo.sk/iframe/pocasie?bg=transparent" scrolling="no"></iframe>
<button class="toggle-btn" onclick="toggleWeather()">
  <span class="material-icons-round" id="toggleIcon">expand_more</span>
  <span id="toggleText">Rozbaliť počasie</span>
</button>

<!-- Google -->
<div class="search-container">
  <div class="search-row">
    <div class="search-wrap">
      <div class="search-field">
        <span class="material-icons-round sf-icon">search</span>
        <input type="text" id="googleInput" placeholder="Hľadať na internete cez Google" autocomplete="off">
        <button class="clear-btn" onclick="clearField('googleInput','googleSuggestions')">✕</button>
      </div>
      <div class="suggestions" id="googleSuggestions" role="listbox"></div>
    </div>
    <button class="search-btn" onclick="doSearch('googleInput','https://www.google.com/search?q=')">
      <span class="material-icons-round">arrow_forward</span>
    </button>
  </div>
</div>

<!-- Slovník -->
<div class="search-container">
  <div class="search-row">
    <div class="search-wrap">
      <div class="search-field">
        <span class="material-icons-round sf-icon">menu_book</span>
        <input type="text" id="slovnikInput" placeholder="Hľadať v slovníku" autocomplete="off" onkeydown="if(event.key==='Enter') doSearch('slovnikInput','https://slovnik.juls.savba.sk/?w=')">
        <button class="clear-btn" onclick="clearField('slovnikInput')">✕</button>
      </div>
    </div>
    <button class="search-btn" onclick="doSearch('slovnikInput','https://slovnik.juls.savba.sk/?w=')">
      <span class="material-icons-round">arrow_forward</span>
    </button>
  </div>
</div>

<!-- Mapy -->
<div class="search-container">
  <div class="search-row">
    <div class="search-wrap">
      <div class="search-field">
        <span class="material-icons-round sf-icon">map</span>
        <input type="text" id="mapyInput" placeholder="Hľadať na mape cez Mapy.com" autocomplete="off" onkeydown="if(event.key==='Enter') doSearch('mapyInput','https://mapy.com/sk/zakladni?q=')">
        <button class="clear-btn" onclick="clearField('mapyInput')">✕</button>
      </div>
    </div>
    <button class="search-btn" onclick="doSearch('mapyInput','https://mapy.com/sk/zakladni?q=')">
      <span class="material-icons-round">arrow_forward</span>
    </button>
  </div>
</div>

<!-- Slov-Lex -->
<div class="search-container">
  <div class="search-row">
    <div class="search-wrap">
      <div class="search-field">
        <span class="material-icons-round sf-icon">gavel</span>
        <input type="text" id="slovlexInput" placeholder="Hľadať právne predpisy" autocomplete="off" onkeydown="if(event.key==='Enter') doSearch('slovlexInput','https://www.slov-lex.sk/ezbierky/vyhladavanie-pravnych-predpisov?hladanyVyraz=')">
        <button class="clear-btn" onclick="clearField('slovlexInput')">✕</button>
      </div>
    </div>
    <button class="search-btn" onclick="doSearch('slovlexInput','https://www.slov-lex.sk/ezbierky/vyhladavanie-pravnych-predpisov?hladanyVyraz=')">
      <span class="material-icons-round">arrow_forward</span>
    </button>
  </div>
</div>

<!-- Kalkulačka -->
<div class="search-container">
  <div class="search-row">
    <div class="search-wrap">
      <div class="search-field">
        <span class="material-icons-round sf-icon">calculate</span>
        <input type="text" id="calcInput" placeholder="Vypočítať príklad" autocomplete="off">
        <button class="clear-btn" onclick="clearCalc()">✕</button>
      </div>
    </div>
    <button class="search-btn" onclick="calculate()">
      <span class="material-icons-round">arrow_forward</span>
    </button>
  </div>

  <div id="advancedKeyboard">
    <!-- Utility bar -->
    <div class="calc-util">
      <button id="backspaceBtn"><span class="material-icons-round">backspace</span></button>
      <button id="clearExprBtn">C</button>
      <button class="key key-fn" onclick="addToCalc('(')">(</button>
      <button class="key key-fn" onclick="addToCalc(')')">)</button>
      <button class="key key-fn" onclick="addToCalc('%')">%</button>
      <button class="key key-fn" onclick="addToCalc('^')">xⁿ</button>
      <button class="key key-fn" onclick="addToCalc('Math.sqrt(')">√</button>
      <button id="closeKeyboardBtn"><span class="material-icons-round">close</span></button>
    </div>
    <!-- Main 4-col grid -->
    <div class="calc-grid">
      <button class="key key-num" onclick="addToCalc('7')">7</button>
      <button class="key key-num" onclick="addToCalc('8')">8</button>
      <button class="key key-num" onclick="addToCalc('9')">9</button>
      <button class="key key-op"  onclick="addToCalc('/')">÷</button>

      <button class="key key-num" onclick="addToCalc('4')">4</button>
      <button class="key key-num" onclick="addToCalc('5')">5</button>
      <button class="key key-num" onclick="addToCalc('6')">6</button>
      <button class="key key-op"  onclick="addToCalc('*')">×</button>

      <button class="key key-num" onclick="addToCalc('1')">1</button>
      <button class="key key-num" onclick="addToCalc('2')">2</button>
      <button class="key key-num" onclick="addToCalc('3')">3</button>
      <button class="key key-op"  onclick="addToCalc('-')">−</button>

      <button class="key key-num" onclick="addToCalc('0')">0</button>
      <button class="key key-fn"  onclick="addToCalc('.')">.</button>
      <button class="key key-op"  onclick="addToCalc('+')">+</button>
      <button class="key key-eq"  onclick="calculate()">=</button>
    </div>
  </div>
</div>

<script>
/* Weather */
function toggleWeather(){
  const iframe=document.getElementById("weather"),icon=document.getElementById("toggleIcon"),text=document.getElementById("toggleText"),btn=document.querySelector(".toggle-btn"),containers=document.querySelectorAll(".search-container"),expanded=iframe.classList.toggle("expanded");
  if(expanded){document.body.style.overflow="auto";containers.forEach(e=>e.style.display="none");iframe.style.height="100vh";iframe.style.overflow="auto";icon.textContent="expand_less";text.textContent="Zbaliť počasie";btn.style.cssText="position:fixed;top:20px;right:20px;";}
  else{document.body.style.overflow="hidden";containers.forEach(e=>e.style.display="block");iframe.style.height="199px";iframe.style.overflow="hidden";icon.textContent="expand_more";text.textContent="Rozbaliť počasie";btn.style.cssText="";iframe.src=iframe.src;}
}

/* Generic search */
function doSearch(id,base){const q=document.getElementById(id).value.trim();if(!q)return;window.open(base+encodeURIComponent(q),'_blank');}
function clearField(id,sugId){const el=document.getElementById(id);el.value='';el.focus();if(sugId)closeSug();}

/* Google Suggestions — JSONP */
let jc=0,dt=null,cs=[],fi=-1,mil=false;
const gi=document.getElementById('googleInput'),sb=document.getElementById('googleSuggestions');

function fetchSug(q){
  if(!q.trim()){closeSug();return;}
  const cb=`__sg${++jc}`;
  const old=document.getElementById('__sgs');if(old)old.remove();
  window[cb]=(data)=>{delete window[cb];cs=(data[1]||[]).slice(0,8);renderSug(q);};
  const s=document.createElement('script');s.id='__sgs';
  s.src=`https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(q)}&callback=${cb}`;
  s.onerror=()=>{delete window[cb];};
  document.head.appendChild(s);
}

const ssv=`<span class="material-icons-round sug-icon">search</span>`;
const asv=`<span class="material-icons-round sug-arrow">arrow_back</span>`;

function renderSug(typed){
  if(!cs.length){closeSug();return;}fi=-1;sb.innerHTML='';

  // Calculate how many items fit without scroll
  const SUG_ITEM_H = 42; // 11px top + 11px bottom padding + ~20px text = ~42px
  const SUG_DIV_H  = 1;
  const fieldRect  = gi.closest('.search-container').getBoundingClientRect();
  const spaceBelow = window.innerHeight - fieldRect.bottom - 12; // 12px gap+margin
  // n items + (n-1) dividers must fit
  let maxN = 1;
  for(let n=1; n<=cs.length; n++){
    const total = n*SUG_ITEM_H + (n-1)*SUG_DIV_H + 16; // 16px padding inside dropdown
    if(total <= spaceBelow) maxN = n; else break;
  }
  const visible = cs.slice(0, maxN);

  visible.forEach((t,i)=>{
    if(i>0){const d=document.createElement('div');d.className='sug-divider';sb.appendChild(d);}
    const b=document.createElement('button');b.className='sug-item';b.setAttribute('role','option');
    b.innerHTML=`${ssv}<span class="sug-text">${t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>${asv}`;
    b.addEventListener('mousedown',e=>{e.preventDefault();gi.value=t;closeSug();doSearch('googleInput','https://www.google.com/search?q=');});
    b.addEventListener('mouseenter',()=>{gi.value=t;setFoc(i);mil=true;});
    b.addEventListener('mouseleave',()=>{mil=false;});
    sb.appendChild(b);
  });
  sb.classList.add('open');
}

function closeSug(){sb.classList.remove('open');sb.innerHTML='';fi=-1;cs=[];}
function setFoc(i){const its=sb.querySelectorAll('.sug-item');its.forEach(e=>e.classList.remove('focused'));if(i>=0&&i<its.length){its[i].classList.add('focused');its[i].scrollIntoView({block:'nearest'});}fi=i;}

gi.addEventListener('input',()=>{clearTimeout(dt);const v=gi.value;if(!v.trim()){closeSug();return;}dt=setTimeout(()=>fetchSug(v),200);});
gi.addEventListener('keydown',e=>{
  const its=sb.querySelectorAll('.sug-item'),len=its.length;
  if(e.key==='ArrowDown'){e.preventDefault();const n=(fi+1)%len;setFoc(n);gi.value=cs[n];}
  else if(e.key==='ArrowUp'){e.preventDefault();const p=fi<=0?len-1:fi-1;setFoc(p);gi.value=cs[p];}
  else if(e.key==='Enter')doSearch('googleInput','https://www.google.com/search?q=');
  else if(e.key==='Escape')closeSug();
});
gi.addEventListener('focus',()=>{if(gi.value.trim()&&cs.length)sb.classList.add('open');});
gi.addEventListener('blur',()=>{if(!mil)setTimeout(closeSug,150);});
document.addEventListener('click',e=>{if(!e.target.closest('#googleSuggestions')&&!e.target.closest('#googleInput'))closeSug();});

/* Calculator */
const ci=document.getElementById("calcInput"),ak=document.getElementById("advancedKeyboard");
ci.addEventListener("focus",()=>ak.classList.add("show"));
document.getElementById("backspaceBtn").addEventListener("click",()=>{ci.value=ci.value.slice(0,-1);ci.focus();});
document.getElementById("clearExprBtn").addEventListener("click",()=>{ci.value="";ci.focus();});
document.getElementById("closeKeyboardBtn").addEventListener("click",()=>ak.classList.remove("show"));
function clearCalc(){ci.value="";ci.focus();}
function addToCalc(s){ci.value+=s;ci.focus();}
function calculate(){try{ci.value=Function('"use strict";return ('+ci.value+')')();}catch(e){ci.value="❌ Neplatný výraz";}}
document.addEventListener("click",e=>{if(!ci.closest(".search-container").contains(e.target))ak.classList.remove("show");});
ci.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();calculate();}else if(e.key==="Escape"){ak.classList.remove("show");ci.blur();}});
ak.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("keydown",e=>{if(e.key==="Escape")ak.classList.remove("show");});

/* Ripple */
document.querySelectorAll("button").forEach(b=>{b.addEventListener("click",function(e){const r=document.createElement("span");r.className="ripple";const rc=this.getBoundingClientRect(),sz=Math.max(rc.width,rc.height);r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rc.left-sz/2}px;top:${e.clientY-rc.top-sz/2}px`;this.appendChild(r);setTimeout(()=>r.remove(),600);});});
</script>
</body>
