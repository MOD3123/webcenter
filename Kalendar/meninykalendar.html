<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Google+Sans+Display:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ═══ M3 Expressive – svetlý režim ═══ */
:root {
  --md-primary:              #1A6EFF;
  --md-on-primary:           #FFFFFF;
  --md-primary-container:    #D9E3FF;
  --md-on-primary-container: #001256;
  --md-primary-fixed:        #D9E3FF;
  --md-primary-fixed-dim:    #ADC6FF;

  --md-secondary:            #4A5875;
  --md-on-secondary:         #FFFFFF;
  --md-secondary-container:  #D3DCFF;
  --md-on-secondary-container:#0D1B34;

  --md-tertiary:             #7B4F8A;
  --md-on-tertiary:          #FFFFFF;
  --md-tertiary-container:   #F8D8FF;
  --md-on-tertiary-container:#31004A;

  --md-error:                #BA1A1A;
  --md-error-container:      #FFDAD6;

  --md-surface:              #F7F8FF;
  --md-surface-dim:          #D8D9E5;
  --md-surface-bright:       #F7F8FF;
  --md-surface-variant:      #DFE2EF;
  --md-on-surface:           #191B24;
  --md-on-surface-variant:   #43465A;
  --md-outline:              #73768A;
  --md-outline-variant:      #C3C5D9;

  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low:    #F1F2FF;
  --md-surface-container:        #ECEEFF;
  --md-surface-container-high:   #E6E8F8;
  --md-surface-container-highest:#E0E2F2;

  --md-inverse-surface:      #2E3044;
  --md-inverse-on-surface:   #EEEFFE;
  --md-inverse-primary:      #ADC6FF;

  --md-shadow-1: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --md-shadow-2: 0 2px 6px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
  --md-shadow-3: 0 4px 12px rgba(0,0,0,.09), 0 2px 4px rgba(0,0,0,.05);
  --md-shadow-4: 0 6px 20px rgba(0,0,0,.11), 0 2px 6px rgba(0,0,0,.06);

  --rad-xs: 8px;
  --rad-sm: 12px;
  --rad-md: 16px;
  --rad-lg: 24px;
  --rad-xl: 32px;
  --rad-2xl: 40px;
  --rad-full: 9999px;

  --header-h: 72px;

  /* Expressive spring easing */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
  --ease-std: cubic-bezier(0.2, 0.0, 0.0, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --md-primary:              #ADC6FF;
    --md-on-primary:           #002983;
    --md-primary-container:    #003EBC;
    --md-on-primary-container: #D9E3FF;

    --md-secondary:            #B9C4E8;
    --md-on-secondary:         #222D4B;
    --md-secondary-container:  #394563;
    --md-on-secondary-container:#D3DCFF;

    --md-tertiary:             #E4B5F3;
    --md-on-tertiary:          #491961;
    --md-tertiary-container:   #623379;
    --md-on-tertiary-container:#F8D8FF;

    --md-surface:              #101420;
    --md-surface-dim:          #101420;
    --md-surface-variant:      #43465A;
    --md-on-surface:           #E2E2EE;
    --md-on-surface-variant:   #C3C5D9;
    --md-outline:              #8D8FA5;
    --md-outline-variant:      #43465A;

    --md-surface-container-lowest: #0B0E1A;
    --md-surface-container-low:    #181B28;
    --md-surface-container:        #1D2030;
    --md-surface-container-high:   #272A3A;
    --md-surface-container-highest:#323546;

    --md-shadow-1: 0 1px 3px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.14);
    --md-shadow-2: 0 2px 6px rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.16);
    --md-shadow-3: 0 4px 12px rgba(0,0,0,.26), 0 2px 4px rgba(0,0,0,.18);
    --md-shadow-4: 0 6px 20px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.20);
  }
}

/* ═══ BASE ═══ */
html { scroll-behavior: smooth; }

body {
  background: var(--md-surface);
  color: var(--md-on-surface);
  font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  vertical-align: middle;
}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--md-outline-variant);
  border-radius: var(--rad-full);
}
::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }

/* ═══ APP SHELL ═══ */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ═══ TOP APP BAR ═══ */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--md-surface-container);
  border-bottom: 1px solid var(--md-outline-variant);
  box-shadow: var(--md-shadow-2);
  transition: background 0.3s;
}

.top-bar-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 20px;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--rad-md);
  background: var(--md-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--md-shadow-2);
  flex-shrink: 0;
}

.brand-icon .material-symbols-rounded {
  font-size: 24px;
  color: var(--md-on-primary);
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-title {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--md-on-surface);
  letter-spacing: -0.3px;
  line-height: 1.1;
}

.brand-sub {
  font-size: 11px;
  color: var(--md-on-surface-variant);
  font-weight: 500;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.bar-spacer { flex: 1; }

/* Search Bar */
.search-wrap {
  flex: 1;
  max-width: 420px;
  position: relative;
}

.search-icon-left {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--md-on-surface-variant);
  pointer-events: none;
  font-size: 20px;
}

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--md-on-surface-variant);
  box-shadow: none;
  padding: 6px;
  border-radius: var(--rad-full);
  display: none;
  transition: background 0.15s;
}
.search-clear:hover { background: var(--md-surface-container-high); box-shadow: none; filter: none; }
.search-clear.visible { display: flex; align-items: center; }

.search-input {
  width: 100%;
  padding: 12px 40px 12px 44px;
  font-size: 14px;
  font-family: inherit;
  border: 1.5px solid var(--md-outline-variant);
  border-radius: var(--rad-full);
  background: var(--md-surface-container-low);
  color: var(--md-on-surface);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

.search-input::placeholder { color: var(--md-on-surface-variant); }

.search-input:focus {
  border-color: var(--md-primary);
  background: var(--md-surface-container-lowest);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 16%, transparent);
}

/* Bar Controls */
.bar-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* Year select */
.year-control {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--md-surface-container-high);
  border: 1.5px solid var(--md-outline-variant);
  border-radius: var(--rad-full);
  padding: 0 6px 0 12px;
  height: 40px;
  cursor: pointer;
  transition: border-color 0.2s;
}

.year-control:focus-within {
  border-color: var(--md-primary);
}

.year-select {
  border: none;
  background: var(--md-surface-container-highest);
  color: var(--md-on-surface);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  padding: 0 2px;
}

/* Icon button */
.icon-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: var(--rad-full);
  background: var(--md-surface-container-high);
  color: var(--md-on-surface-variant);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: none;
  transition: background 0.15s, color 0.15s, transform 0.15s;
  padding: 0;
}

.icon-btn:hover {
  background: var(--md-surface-container-highest);
  color: var(--md-on-surface);
  filter: none;
  box-shadow: none;
}

.icon-btn:active {
  filter: brightness(0.92);
  filter: none;
}

.icon-btn.primary {
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.icon-btn.primary:hover {
  background: color-mix(in srgb, var(--md-primary-container) 88%, var(--md-primary));
}

/* ═══ SUB TOOLBAR ═══ */
.sub-toolbar {
  max-width: 1440px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* Month chips */
.month-chips {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  flex: 1;
  padding-bottom: 2px;
  scrollbar-width: none;
  min-width: 0;
}
.month-chips::-webkit-scrollbar { display: none; }

.month-chip {
  padding: 8px 14px;
  border: 1.5px solid var(--md-outline-variant);
  border-radius: var(--rad-full);
  background: transparent;
  color: var(--md-on-surface-variant);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: none;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  flex-shrink: 0;
  letter-spacing: 0.1px;
}

.month-chip:hover {
  background: var(--md-surface-container-high);
  color: var(--md-on-surface);
  border-color: var(--md-outline);
  filter: none;
  box-shadow: none;
}

.month-chip.active {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
  border-color: var(--md-secondary-container);
  box-shadow: var(--md-shadow-1);
}

.month-chip.all-chip.active {
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  border-color: var(--md-primary-container);
}

/* View Toggle */
.view-toggle {
  display: flex;
  background: var(--md-surface-container-highest);
  border-radius: var(--rad-full);
  padding: 3px;
  gap: 2px;
  flex-shrink: 0;
}

.view-btn {
  padding: 7px 14px;
  border: none;
  border-radius: var(--rad-full);
  background: transparent;
  color: var(--md-on-surface-variant);
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
  box-shadow: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}

.view-btn .material-symbols-rounded { font-size: 17px; }
.view-btn span:last-child { display: none; }

.view-btn:hover {
  background: color-mix(in srgb, var(--md-surface-container-highest) 40%, var(--md-surface-container));
  color: var(--md-on-surface);
  filter: none;
  box-shadow: none;
}

.view-btn.active {
  background: var(--md-primary);
  color: var(--md-on-primary);
  box-shadow: var(--md-shadow-2);
}

/* ═══ MAIN CONTENT ═══ */
.main-content {
  width: 100%;
  padding: 16px 20px 40px;
  flex: 1;
}

.content-inner {
  width: 800px;
  margin: 0 auto;
}

/* ═══ TODAY BANNER ═══ */
.today-banner {
  background: linear-gradient(135deg, var(--md-primary), color-mix(in srgb, var(--md-primary) 60%, var(--md-tertiary)));
  color: var(--md-on-primary);
  border-radius: var(--rad-xl);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--md-shadow-3);
  position: relative;
  overflow: hidden;
}

.today-banner::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -5%;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  pointer-events: none;
}

.today-banner::after {
  content: '';
  position: absolute;
  bottom: -40%;
  right: 10%;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  pointer-events: none;
}

.today-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--rad-lg);
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
}

.today-icon .material-symbols-rounded { font-size: 28px; color: #fff; }

.today-info { flex: 1; }

.today-date {
  font-size: 13px;
  opacity: 0.82;
  font-weight: 500;
  margin-bottom: 2px;
  letter-spacing: 0.3px;
}

.today-names {
  font-size: 22px;
  font-weight: 700;
  font-family: 'Google Sans Display', sans-serif;
  line-height: 1.2;
}

.today-sub {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 4px;
}

/* ═══ SEARCH RESULTS ═══ */
.search-results-header {
  font-size: 13px;
  color: var(--md-on-surface-variant);
  font-weight: 600;
  padding: 8px 4px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.results-count {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
  border-radius: var(--rad-full);
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 700;
}

/* ═══ CALENDAR GRID ═══ */
.calendar-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
  animation: fadeSlideUp 0.3s var(--ease-out);
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Month card – width inherited from .content-inner ── */
.month-card {
  background: var(--md-surface-container-low);
  border-radius: var(--rad-xl);
  border: 1px solid var(--md-outline-variant);
  box-shadow: var(--md-shadow-1);
  overflow: hidden;
  width: 100%;
  flex-shrink: 0;
}

.month-card-header {
  padding: 18px 22px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--md-outline-variant);
  background: var(--md-surface-container);
}

.month-title-wrap { display: flex; align-items: center; gap: 10px; }

.month-number-badge {
  width: 36px;
  height: 36px;
  border-radius: var(--rad-sm);
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
}

.month-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--md-on-surface);
  font-family: 'Google Sans Display', sans-serif;
}

.month-day-count {
  font-size: 12px;
  color: var(--md-on-surface-variant);
  font-weight: 500;
  background: var(--md-surface-container-highest);
  padding: 4px 10px;
  border-radius: var(--rad-full);
}

.month-body { padding: 14px 16px 16px; }

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 6px;
}

.weekday {
  text-align: center;
  font-weight: 700;
  font-size: 11px;
  color: var(--md-on-surface-variant);
  padding: 6px 0;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.weekday:last-child { color: var(--md-error); }

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

/* ── Day cell ── */
.day {
  min-height: 86px;
  padding: 9px 10px;
  border-radius: var(--rad-md);
  border: 1px solid var(--md-outline-variant);
  background: var(--md-surface-container-lowest);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  overflow: hidden;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
  position: relative;
}

.day:hover {
  background: var(--md-surface-container-high);
  border-color: var(--md-primary);
  box-shadow: var(--md-shadow-2);
  z-index: 2;
}

.day:active {
  background: color-mix(in srgb, var(--md-primary) 10%, var(--md-surface-container));
  border-color: var(--md-primary);
}

.day.has-name {
  background: var(--md-surface-container-lowest);
  border-color: var(--md-outline-variant);
}

.day.other-month {
  opacity: 0.22;
  cursor: default;
  pointer-events: none;
  background: transparent;
  border-color: transparent;
}

/* Sunday styling */
.day.sunday .day-number { color: var(--md-error); }

/* Today */
.day.today {
  border: 2px solid var(--md-primary);
  background: color-mix(in srgb, var(--md-primary) 8%, var(--md-surface-container-lowest));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 18%, transparent), var(--md-shadow-2);
}

.day.today .day-number {
  background: var(--md-primary);
  color: var(--md-on-primary);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 5px;
  flex-shrink: 0;
  line-height: 1;
}

.day-number {
  font-size: 22px;
  font-weight: 800;
  color: var(--md-on-surface);
  margin-bottom: 4px;
  flex-shrink: 0;
  line-height: 1;
  letter-spacing: -0.5px;
}

.day-names {
  font-size: 11.5px;
  color: var(--md-on-surface-variant);
  line-height: 1.38;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  font-weight: 500;
  word-break: break-word;
}

.day.has-name::after {
  content: '';
  position: absolute;
  bottom: 6px;
  right: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--md-primary) 55%, transparent);
}

.day.has-sviatok {
  background: color-mix(in srgb, var(--md-tertiary-container) 55%, var(--md-surface-container-lowest));
  border-color: color-mix(in srgb, var(--md-tertiary) 40%, var(--md-outline-variant));
}

.day.has-sviatok .day-names {
  color: color-mix(in srgb, var(--md-tertiary) 90%, var(--md-on-surface-variant));
  font-weight: 600;
}

.day.has-sviatok::after { background: var(--md-tertiary); }

/* ═══ LIST VIEW ═══ */
.list-view {
  animation: fadeSlideUp 0.3s var(--ease-out);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.list-month-section {
  background: var(--md-surface-container-low);
  border-radius: var(--rad-xl);
  border: 1px solid var(--md-outline-variant);
  overflow: hidden;
  box-shadow: var(--md-shadow-1);
}

.list-month-header {
  padding: 14px 20px;
  background: var(--md-surface-container);
  border-bottom: 1px solid var(--md-outline-variant);
  display: flex;
  align-items: center;
  gap: 10px;
}

.list-month-badge {
  width: 30px;
  height: 30px;
  border-radius: var(--rad-sm);
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;

  "11-21":"Elvíra","11-22":"Cecília","11-23":"Klement","11-24":"Emília","11-25":"Katarína","11-26":"Kornel","11-27":"Milan","11-28":"Henrieta","11-29":"Vratko","11-30":"Ondrej",
  "12-01":"Edmund","12-02":"Bibiána","12-03":"Oldrich","12-04":"Barbora","12-05":"Oto","12-06":"Mikuláš","12-07":"Ambróz","12-08":"Marína","12-09":"Izabela","12-10":"Radúz",
  "12-11":"Hilda","12-12":"Otília","12-13":"Lucia","12-14":"Branislava","12-15":"Ivica","12-16":"Albína","12-17":"Kornélia","12-18":"Sláva","12-19":"Judita","12-20":"Dagmara",
  "12-21":"Bohdan","12-22":"Adela","12-23":"Nadežda","12-24":"Adam, Eva (Štedrý deň) (Sviatok)","12-25":"1. sviatok vianočný (Sviatok)","12-26":"Štefan (2. sviatok vianočný) (Sviatok), Mano","12-27":"Filoména","12-28":"Ivana","12-29":"Milada","12-30":"Dávid","12-31":"Silvester"
};

const monthNames = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const monthShort = ['Jan','Feb','Mar','Apr','Máj','Jún','Júl','Aug','Sep','Okt','Nov','Dec'];
const weekdayNames = ['Po','Ut','St','Št','Pi','So','Ne'];

/* ─── HELPERS ─── */
function removeDiacritics(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function getDaysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function getFirstDay(y,m){ const d=new Date(y,m-1,1).getDay(); return d===0?6:d-1; }
function getKey(d,m){ return `${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function getNames(d,m){ return meniny[getKey(d,m)]||''; }
function isSviatok(names){ return names.includes('(Sviatok)'); }

/* ─── STATE ─── */
let currentYear = new Date().getFullYear();
let currentMonth = 0; // 0 = all
let currentView = 'calendar';
let searchQuery = '';

const today = new Date();
const todayD = today.getDate(), todayM = today.getMonth()+1, todayY = today.getFullYear();

/* ─── TODAY BANNER ─── */
function initTodayBanner(){
  const names = getNames(todayD, todayM);
  const dateLabel = `${todayD}. ${monthNames[todayM-1]} ${todayY}`;
  document.getElementById('todayDateLabel').textContent = dateLabel;
  if(names){
    const display = names.replace(/\s*\(Sviatok\)/g,'');
    document.getElementById('todayNamesLabel').textContent = display || 'Štátny sviatok';
  } else {
    document.getElementById('todayNamesLabel').textContent = 'Žiadne meniny';
  }
}

/* ─── CALENDAR ─── */
function renderCalendar(){
  const view = document.getElementById('calendarView');
  view.innerHTML = '';
  const months = currentMonth ? [currentMonth] : Array.from({length:12},(_,i)=>i+1);

  // single month → centre the card
  view.classList.toggle('single-month', months.length === 1);

  months.forEach(m=>{
    const daysInMonth = getDaysInMonth(currentYear, m);
    const firstDay = getFirstDay(currentYear, m);

    const card = document.createElement('div');
    card.className = 'month-card';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'month-card-header';
    hdr.innerHTML = `
      <div class="month-title-wrap">
        <div class="month-number-badge">${m}</div>
        <div class="month-title">${monthNames[m-1]}</div>
      </div>
      <div class="month-day-count">${daysInMonth} dní</div>
    `;
    card.appendChild(hdr);

    // Body
    const body = document.createElement('div');
    body.className = 'month-body';

    // Weekdays row
    const wkRow = document.createElement('div');
    wkRow.className = 'weekdays';
    weekdayNames.forEach(dn=>{
      const d = document.createElement('div');
      d.className = 'weekday';
      d.textContent = dn;
      wkRow.appendChild(d);
    });
    body.appendChild(wkRow);

    // Days
    const daysGrid = document.createElement('div');
    daysGrid.className = 'days';

    // Empty cells
    for(let i=0;i<firstDay;i++){
      const e = document.createElement('div');
      e.className = 'day other-month';
      daysGrid.appendChild(e);
    }

    for(let d=1;d<=daysInMonth;d++){
      const dow = (firstDay + d - 1) % 7; // 0=Mon … 6=Sun
      const names = getNames(d,m);
      const isSv = isSviatok(names);
      const isToday = d===todayD && m===todayM && currentYear===todayY;

      const cell = document.createElement('div');
      cell.className = 'day' + (isToday?' today':'') + (names?' has-name':'') + (isSv?' has-sviatok':'') + (dow===6?' sunday':'');

      const numEl = document.createElement('div');
      numEl.className = 'day-number';
      numEl.textContent = d;
      cell.appendChild(numEl);

      if(names){
        const nEl = document.createElement('div');
        nEl.className = 'day-names';
        nEl.textContent = names.replace(/\s*\(Sviatok\)/g,'');
        cell.appendChild(nEl);
      }

      cell.addEventListener('click', ()=>showModal(d,m,currentYear,names));
      daysGrid.appendChild(cell);
    }

    body.appendChild(daysGrid);
    card.appendChild(body);
    view.appendChild(card);
  });
}

/* ─── LIST VIEW ─── */
function renderList(){
  const view = document.getElementById('listView');
  view.innerHTML = '';
  const months = currentMonth ? [currentMonth] : Array.from({length:12},(_,i)=>i+1);

  months.forEach(m=>{
    const days = getDaysInMonth(currentYear, m);
    const items = [];
    for(let d=1;d<=days;d++){
      const names = getNames(d,m);
      if(names) items.push({d,m,names});
    }
    if(!items.length) return;

    const section = document.createElement('div');
    section.className = 'list-month-section';

    const mHdr = document.createElement('div');
    mHdr.className = 'list-month-header';
    mHdr.innerHTML = `
      <div class="list-month-badge">${m}</div>
      <div class="list-month-title">${monthNames[m-1]} ${currentYear}</div>
      <div class="list-month-count">${items.length} mien</div>
    `;
    section.appendChild(mHdr);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'list-items';

    items.forEach(({d, m: mo, names})=>{
      const isSv = isSviatok(names);
      const isToday = d===todayD && mo===todayM && currentYear===todayY;
      const displayNames = names.replace(/\s*\(Sviatok\)/g,'');

      const li = document.createElement('div');
      li.className = 'list-item' + (isSv?' sviatok-item':'') + (isToday?' today-item':'');
      li.innerHTML = `
        <div class="list-date-badge">
          <div class="list-date-day">${d}</div>
          <div class="list-date-month-abbr">${monthShort[mo-1]}</div>
        </div>
        <div class="list-name-wrap">
          <div class="list-name">${displayNames}</div>
          ${isSv?'<div class="list-name-full">Štátny sviatok</div>':''}
        </div>
        <div class="list-arrow"><span class="material-symbols-rounded">chevron_right</span></div>
      `;
      li.addEventListener('click', ()=>showModal(d,mo,currentYear,names));
      itemsWrap.appendChild(li);
    });

    section.appendChild(itemsWrap);
    view.appendChild(section);
  });
}

/* ─── SEARCH ─── */
function performSearch(q){
  const view = document.getElementById('searchView');
  view.innerHTML = '';

  const qNorm = removeDiacritics(q).toLowerCase().trim();
  const results = [];

  for(let m=1;m<=12;m++){
    const days = getDaysInMonth(currentYear, m);
    for(let d=1;d<=days;d++){
      const names = getNames(d,m);
      if(!names) continue;
      const nNorm = removeDiacritics(names).toLowerCase();
      const dateStr = `${d}.${m}`;
      if(nNorm.includes(qNorm) || dateStr.includes(qNorm)){
        results.push({d,m,names});
      }
    }
  }

  document.getElementById('resultsCount').textContent = results.length;

  if(!results.length){
    view.innerHTML = `
      <div class="empty-state">
        <div class="material-symbols-rounded empty-icon">search_off</div>
        <div class="empty-title">Žiadne výsledky</div>
        <div class="empty-sub">Skúste iné meno alebo dátum</div>
      </div>`;
    return;
  }

  results.sort((a,b)=> a.m!==b.m ? a.m-b.m : a.d-b.d);

  const itemsWrap = document.createElement('div');
  itemsWrap.className = 'list-month-section';
  const inner = document.createElement('div');
  inner.className = 'list-items';

  results.forEach(({d, m, names})=>{
    const isSv = isSviatok(names);
    const isToday = d===todayD && m===todayM && currentYear===todayY;
    const displayNames = names.replace(/\s*\(Sviatok\)/g,'');

    const li = document.createElement('div');
    li.className = 'list-item' + (isSv?' sviatok-item':'') + (isToday?' today-item':'');
    li.innerHTML = `
      <div class="list-date-badge">
        <div class="list-date-day">${d}</div>
        <div class="list-date-month-abbr">${monthShort[m-1]}</div>
      </div>
      <div class="list-name-wrap">
        <div class="list-name">${displayNames}</div>
      </div>
      <div class="list-arrow"><span class="material-symbols-rounded">chevron_right</span></div>
    `;
    li.addEventListener('click', ()=>showModal(d,m,currentYear,names));
    inner.appendChild(li);
  });

  itemsWrap.appendChild(inner);
  view.appendChild(itemsWrap);
}

/* ─── VIEW MANAGEMENT ─── */
function setView(v){
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===v);
  });
  refreshViews();
}

function refreshViews(){
  const cal = document.getElementById('calendarView');
  const list = document.getElementById('listView');
  const search = document.getElementById('searchView');
  const searchHdr = document.getElementById('searchHeader');
  const todayBanner = document.getElementById('todayBanner');

  if(searchQuery.trim()){
    cal.style.display = 'none';
    list.style.display = 'none';
    search.style.display = 'flex';
    searchHdr.style.display = 'flex';
    todayBanner.style.display = 'none';
    performSearch(searchQuery);
  } else {
    searchHdr.style.display = 'none';
    todayBanner.style.display = 'flex';
    search.style.display = 'none';
    if(currentView==='calendar'){
      cal.style.display = 'grid';
      list.style.display = 'none';
      renderCalendar();
    } else {
      cal.style.display = 'none';
      list.style.display = 'flex';
      renderList();
    }
  }
}

/* ─── MODAL ─── */
function showModal(d,m,y,names){
  document.getElementById('modalTitle').textContent = `${d}. ${monthNames[m-1]} ${y}`;
  const cards = document.getElementById('modalCards');
  cards.innerHTML = '';

  if(!names){
    cards.innerHTML = '<div class="modal-empty">Žiadne meniny pre tento deň</div>';
  } else {
    const isSv = isSviatok(names);
    const cleanNames = names.replace(/\s*\(Sviatok\)/g,'').split(',').map(n=>n.trim()).filter(Boolean);
    cleanNames.forEach((name,i)=>{
      const card = document.createElement('div');
      card.className = 'modal-name-card' + (isSv && i===cleanNames.length-1?'':isSv?' sviatok-card':'');
      // Detect if this item contains sviatok
      const isThisSviatok = isSv && names.split(',').some(n=> n.includes('(Sviatok)') && removeDiacritics(n).toLowerCase().includes(removeDiacritics(name).toLowerCase()));
      if(isSv) card.className = 'modal-name-card sviatok-card';

      card.innerHTML = `
        <div class="modal-name-avatar">${name[0]||'?'}</div>
        <div class="modal-name-text">${name}</div>
        ${isSv?'<span class="sviatok-badge">Sviatok</span>':''}
      `;
      cards.appendChild(card);
    });
    if(!cleanNames.length){
      cards.innerHTML = '<div class="modal-empty">Štátny sviatok</div>';
    }
  }

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

/* ─── EVENTS ─── */
document.getElementById('yearInput').addEventListener('change', e=>{
  const v = parseInt(e.target.value);
  if(v>=2000 && v<=2100){ currentYear=v; refreshViews(); }
});

document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentYear = todayY;
  currentMonth = todayM;
  document.getElementById('yearInput').value = todayY;
  searchQuery = '';
  document.getElementById('searchClear').classList.remove('visible');

  // Select correct month chip
  document.querySelectorAll('.month-chip').forEach(c=>{
    c.classList.toggle('active', parseInt(c.dataset.month)===currentMonth);
  });

  setView('calendar');

  requestAnimationFrame(()=>{
    const el = document.querySelector('.day.today');
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  });
});

document.getElementById('searchInput').addEventListener('input', e=>{
  searchQuery = e.target.value;
  document.getElementById('searchClear').classList.toggle('visible', !!searchQuery);
  refreshViews();
});

document.getElementById('searchClear').addEventListener('click', ()=>{
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('searchClear').classList.remove('visible');
  refreshViews();
});

document.querySelectorAll('.month-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.month-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentMonth = parseInt(chip.dataset.month);
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').classList.remove('visible');
    refreshViews();
  });
});

document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>setView(btn.dataset.view));
});

document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('modalOverlay')) closeModal();
});

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ─── INIT ─── */
(function(){
  // Populate year select: 5 years back to 5 years forward
  const sel = document.getElementById('yearInput');
  for(let y = todayY - 5; y <= todayY + 5; y++){
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    sel.appendChild(opt);
  }

  currentYear = todayY;
  currentMonth = todayM;
  sel.value = currentYear;

  // activate the correct month chip
  document.querySelectorAll('.month-chip').forEach(c=>{
    c.classList.toggle('active', parseInt(c.dataset.month) === currentMonth);
  });

  initTodayBanner();
  refreshViews();

  // scroll to today after render
  requestAnimationFrame(()=>{
    const el = document.querySelector('.day.today');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  });
})();
</script>
</body>
