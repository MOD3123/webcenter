<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domovská stránka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
          --bg: #0a0e1a;
          --surface: rgba(255,255,255,0.04);
          --surface-hover: rgba(255,255,255,0.08);
          --border: rgba(255,255,255,0.08);
          --text: #e8eaf0;
          --muted: #8890a4;
          --accent: #4f8ef7;
          --accent2: #7c5cbf;
          --gold: #d4a853;
          --danger: #e05555;
          --green: #4dba87;
          --clock-color: #fff;
        }

        @media (prefers-color-scheme: light) {
          :root {
            --bg: #dde2ef;
            --surface: rgba(255,255,255,0.80);
            --surface-hover: rgba(255,255,255,0.98);
            --border: rgba(0,0,0,0.13);
            --text: #0d1117;
            --muted: #3a4260;
            --accent: #1a5fd4;
            --accent2: #5030a0;
            --gold: #8a5e00;
            --danger: #aa1f1f;
            --green: #1a7050;
            --clock-color: #0d1117;
          }
          body { background: #dde2ef; }
          body::before {
            background:
              radial-gradient(ellipse 80% 60% at 15% 10%, rgba(79,142,247,0.15) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 85% 80%, rgba(124,92,191,0.10) 0%, transparent 55%);
          }
          body::after { opacity: 0.06; }
          .clock-time { text-shadow: 0 2px 20px rgba(26,95,212,0.10); }
          .link-card {
            background: rgba(255,255,255,0.82) !important;
            border-color: rgba(0,0,0,0.11) !important;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
          }
          .link-card:hover {
            background: #fff !important;
            border-color: rgba(0,0,0,0.20) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.13) !important;
          }
          .link-label { color: #0d1117 !important; font-weight: 600 !important; }
          .link-icon { background: rgba(0,0,0,0.06) !important; }
          .section-label { color: #3a4260; }
          .search-group-label { color: #3a4260; }
          .mini-weather-row {
            background: rgba(255,255,255,0.82);
            border-color: rgba(0,0,0,0.11);
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
          }
          .mini-weather-temp { color: #0d1117 !important; }
          .mini-weather-city { color: #3a4260 !important; }
          .mini-weather-extra span { background: rgba(0,0,0,0.08) !important; color: #3a4260 !important; }
          .search-box {
            background: rgba(255,255,255,0.88) !important;
            border-color: rgba(0,0,0,0.13) !important;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
          }
          .search-box:focus-within {
            border-color: rgba(26,95,212,0.55) !important;
            background: #fff !important;
            box-shadow: 0 0 0 3px rgba(26,95,212,0.12) !important;
          }
          .search-box input { color: #0d1117 !important; }
          .search-box input::placeholder { color: #6b7280 !important; }
          .search-tag { background: rgba(0,0,0,0.08) !important; color: #3a4260 !important; border-color: rgba(0,0,0,0.12) !important; }
          .search-clear { color: #6b7280 !important; }
          .suggestions { background: rgba(255,255,255,0.99) !important; border-color: rgba(0,0,0,0.13) !important; }
          .suggestions div { color: #3a4260 !important; border-color: rgba(0,0,0,0.06) !important; }
          .suggestions div:hover { background: rgba(26,95,212,0.07) !important; color: #0d1117 !important; }
          .calc-keyboard { background: rgba(230,234,245,0.99) !important; border-color: rgba(0,0,0,0.13) !important; }
          .calc-key { background: rgba(255,255,255,0.85) !important; border-color: rgba(0,0,0,0.12) !important; color: #0d1117 !important; }
          .calc-key:hover { color: #0d1117 !important; }
          .calc-key.equals { color: var(--accent) !important; }
          .calc-controls button { background: rgba(255,255,255,0.75) !important; border-color: rgba(0,0,0,0.12) !important; color: #3a4260 !important; }
          .weather-frame-wrap { background: rgba(255,255,255,0.75) !important; border-color: rgba(0,0,0,0.11) !important; }
          .weather-toggle-btn { color: #3a4260 !important; border-color: rgba(0,0,0,0.13) !important; }
          .weather-toggle-btn:hover { color: #0d1117 !important; background: rgba(255,255,255,0.85) !important; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        a, button {
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
        }

        body {
          min-height: 100vh;
          background: var(--bg);
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          overflow-x: hidden;
          position: relative;
        }

        /* Atmospheric background */
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          background:
            radial-gradient(ellipse 80% 60% at 15% 10%, rgba(79,142,247,0.12) 0%, transparent 60%),
            radial-gradient(ellipse 60% 50% at 85% 80%, rgba(124,92,191,0.1) 0%, transparent 55%),
            radial-gradient(ellipse 40% 40% at 50% 50%, rgba(212,168,83,0.04) 0%, transparent 60%);
          pointer-events: none;
          z-index: 0;
        }

        /* Noise texture overlay */
        body::after {
          content: '';
          position: fixed;
          inset: 0;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
          pointer-events: none;
          z-index: 0;
          opacity: 0.4;
        }

        .wrapper {
          position: relative;
          z-index: 1;
          min-height: 100vh;
          display: grid;
          grid-template-rows: auto auto auto 1fr;
          gap: 0;
          padding: 24px 20px 20px;
          max-width: 680px;
          margin: 0 auto;
        }

        /* === CLOCK === */
        .clock-section {
          text-align: center;
          padding: 10px 0 18px;
          animation: fadeUp 0.6s ease both;
        }

        .clock-time {
          font-family: 'DM Serif Display', serif;
          font-size: clamp(52px, 15vw, 88px);
          font-weight: 400;
          letter-spacing: -2px;
          line-height: 1;
          color: var(--clock-color, #fff);
          text-shadow: 0 0 60px rgba(79,142,247,0.3);
        }

        .clock-date {
          font-size: 13px;
          color: var(--muted);
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin-top: 6px;
          font-weight: 500;
        }

        /* === MINI WEATHER === */
        .mini-weather {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin: -6px 0 18px;
          animation: fadeUp 0.6s 0.05s ease both;
        }

        .mini-weather-row {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 40px;
          padding: 8px 16px;
          min-height: 40px;
        }

        .mini-weather-city {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.05em;
          color: var(--muted);
          text-transform: uppercase;
          white-space: nowrap;
        }

        .mini-weather-icon {
          font-size: 17px;
          line-height: 1;
          text-align: center;
        }

        .mini-weather-temp {
          font-weight: 700;
          color: var(--text);
          font-size: 14px;
          white-space: nowrap;
        }

        .mini-weather-desc {
          color: var(--muted);
          font-size: 12px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          padding: 0 4px;
        }

        .mini-weather-extra {
          display: flex;
          gap: 6px;
          flex-shrink: 0;
        }

        .mini-weather-extra span {
          font-size: 10px;
          color: var(--muted);
          white-space: nowrap;
          background: rgba(255,255,255,0.05);
          border-radius: 20px;
          padding: 2px 6px;
        }

        @media (max-width: 400px) {
          .mini-weather-row { gap: 7px; padding: 7px 12px; }
          .mini-weather-city { font-size: 10px; }
          .mini-weather-extra span { font-size: 9px; padding: 2px 4px; }
          .mini-weather-extra { gap: 3px; }
        }

        /* === QUICK LINKS === */
        .links-section {
          margin-bottom: 20px;
          animation: fadeUp 0.6s 0.1s ease both;
        }

        .section-label {
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--muted);
          margin-bottom: 10px;
          padding-left: 2px;
        }

        .links-grid {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 8px;
        }

        .link-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 14px 8px 12px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 14px;
          text-decoration: none;
          color: var(--text);
          transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
          cursor: pointer;
          position: relative;
          overflow: hidden;
          -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          user-select: none;
        }

        .link-card::before {
          content: '';
          position: absolute;
          inset: 0;
          opacity: 0;
          transition: opacity 0.25s ease;
          border-radius: inherit;
        }

        .link-card:hover {
          border-color: rgba(255,255,255,0.18);
          background: var(--surface-hover);
          box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }

        .link-card:hover::before { opacity: 1; }

        /* Individual card accents */
        .link-card.spravy { --card-color: #e05555; }
        .link-card.spravy::before { background: radial-gradient(ellipse at 50% 100%, rgba(224,85,85,0.15), transparent 70%); }
        .link-card.spravy .link-icon { color: #e05555; }

        .link-card.doprava { --card-color: #4f8ef7; }
        .link-card.doprava::before { background: radial-gradient(ellipse at 50% 100%, rgba(79,142,247,0.15), transparent 70%); }
        .link-card.doprava .link-icon { color: #4f8ef7; }

        .link-card.pravo { --card-color: var(--gold); }
        .link-card.pravo::before { background: radial-gradient(ellipse at 50% 100%, rgba(212,168,83,0.15), transparent 70%); }
        .link-card.pravo .link-icon { color: var(--gold); }

        .link-card.letaky { --card-color: var(--green); }
        .link-card.letaky::before { background: radial-gradient(ellipse at 50% 100%, rgba(77,186,135,0.15), transparent 70%); }
        .link-card.letaky .link-icon { color: var(--green); }

        .link-card.pocasie-link { --card-color: #7ec8e3; }
        .link-card.pocasie-link::before { background: radial-gradient(ellipse at 50% 100%, rgba(126,200,227,0.15), transparent 70%); }
        .link-card.pocasie-link .link-icon { color: #7ec8e3; }

        .link-card.nastroje { --card-color: #a78bfa; }
        .link-card.nastroje::before { background: radial-gradient(ellipse at 50% 100%, rgba(167,139,250,0.15), transparent 70%); }
        .link-card.nastroje .link-icon { color: #a78bfa; }

        .link-card.psc { --card-color: #f97316; }
        .link-card.psc::before { background: radial-gradient(ellipse at 50% 100%, rgba(249,115,22,0.15), transparent 70%); }
        .link-card.psc .link-icon { color: #f97316; }

        .link-card.zastavky { --card-color: #34d399; }
        .link-card.zastavky::before { background: radial-gradient(ellipse at 50% 100%, rgba(52,211,153,0.15), transparent 70%); }
        .link-card.zastavky .link-icon { color: #34d399; }

        .link-card.konvertor { --card-color: #fb923c; }
        .link-card.konvertor::before { background: radial-gradient(ellipse at 50% 100%, rgba(251,146,60,0.15), transparent 70%); }
        .link-card.konvertor .link-icon { color: #fb923c; }

        .link-card.slovnik2 { --card-color: #60a5fa; }
        .link-card.slovnik2::before { background: radial-gradient(ellipse at 50% 100%, rgba(96,165,250,0.15), transparent 70%); }
        .link-card.slovnik2 .link-icon { color: #60a5fa; }

        .link-icon {
          font-size: 22px;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 36px;
          height: 36px;
          border-radius: 10px;
          background: rgba(255,255,255,0.06);
        }

        .link-icon svg { width: 20px; height: 20px; }

        .link-label {
          font-size: 11px;
          font-weight: 500;
          text-align: center;
          color: var(--muted);
          line-height: 1.2;
          transition: color 0.2s;
        }

        .link-card:hover .link-label { color: var(--text); }

        /* === SEARCH === */
        .search-section {
          display: flex;
          flex-direction: column;
          gap: 8px;
          animation: fadeUp 0.6s 0.3s ease both;
        }

        .search-group-label {
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--muted);
          padding-left: 2px;
          margin-top: 4px;
        }

        .search-row {
          position: relative;
        }

        .search-box {
          display: flex;
          align-items: center;
          gap: 10px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 50px;
          padding: 0 6px 0 16px;
          height: 46px;
          transition: all 0.2s;
          position: relative;
        }

        .search-box:focus-within {
          border-color: rgba(79,142,247,0.5);
          background: rgba(79,142,247,0.05);
          box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
        }

        .search-tag {
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.08em;
          color: var(--muted);
          background: rgba(255,255,255,0.06);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 3px 9px;
          white-space: nowrap;
          flex-shrink: 0;
        }

        .search-box input {
          flex: 1;
          border: none;
          outline: none;
          background: transparent;
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          font-size: 14px;
          min-width: 0;
        }

        .search-box input::placeholder { color: var(--muted); }

        .search-clear {
          background: none;
          border: none;
          color: var(--muted);
          cursor: pointer;
          font-size: 14px;
          padding: 4px;
          display: none;
          line-height: 1;
          border-radius: 50%;
          transition: color 0.2s;
          flex-shrink: 0;
        }

        .search-clear:hover { color: var(--text); }

        .search-submit {
          background: var(--accent);
          border: none;
          color: #fff;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.2s;
          flex-shrink: 0;
        }

        .search-submit:hover {
          background: #3a7de8;
        }

        .search-submit svg { width: 15px; height: 15px; }

        /* Suggestions – Google style */
        .suggestions {
          position: absolute;
          top: calc(100% + 4px);
          left: 0;
          right: 0;
          background: rgba(18,22,36,0.98);
          border: 1px solid var(--border);
          border-radius: 14px;
          overflow: hidden;
          box-shadow: 0 12px 40px rgba(0,0,0,0.6);
          z-index: 999;
          display: none;
          backdrop-filter: blur(20px);
          padding: 8px 0;
        }

        .suggestions.open { display: block; }

        .sug-divider {
          height: 1px;
          background: rgba(255,255,255,0.05);
          margin: 0 12px;
        }

        .sug-item {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          padding: 11px 14px;
          background: none;
          border: none;
          cursor: pointer;
          font-size: 14px;
          font-family: 'DM Sans', sans-serif;
          color: var(--muted);
          text-align: left;
          transition: background 0.12s, color 0.12s;
          position: relative;
          overflow: hidden;
        }

        .sug-item:hover, .sug-item.focused {
          background: rgba(79,142,247,0.08);
          color: var(--text);
        }

        .sug-icon {
          font-size: 16px;
          color: var(--muted);
          flex-shrink: 0;
          opacity: 0.7;
        }

        .sug-text {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .sug-arrow {
          font-size: 15px;
          color: var(--muted);
          opacity: 0.4;
          flex-shrink: 0;
          transform: rotate(45deg);
        }

        /* === Kalkulačka === */
        .calc-keyboard {
          position: absolute;
          bottom: calc(100% + 6px);
          left: 0;
          right: 0;
          background: rgba(14,18,30,0.98);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 10px;
          display: none;
          backdrop-filter: blur(20px);
          box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
          z-index: 100;
        }

        .calc-keyboard.show { display: block; }

        .calc-controls {
          display: flex;
          gap: 6px;
          margin-bottom: 8px;
        }

        .calc-controls button {
          flex: 1;
          padding: 7px;
          font-size: 12px;
          font-family: 'DM Sans', sans-serif;
          border-radius: 8px;
          border: 1px solid var(--border);
          background: var(--surface);
          color: var(--muted);
          cursor: pointer;
          transition: all 0.15s;
        }

        .calc-controls button:hover { background: var(--surface-hover); color: var(--text); }

        .calc-keys {
          display: grid;
          grid-template-columns: repeat(6, 1fr);
          gap: 5px;
        }

        .calc-key {
          padding: 9px 4px;
          font-size: 13px;
          font-family: 'DM Sans', sans-serif;
          border-radius: 8px;
          border: 1px solid var(--border);
          background: var(--surface);
          color: var(--text);
          cursor: pointer;
          transition: all 0.15s;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .calc-key:hover { background: rgba(79,142,247,0.15); border-color: rgba(79,142,247,0.3); color: #fff; }
        .calc-key.equals { background: rgba(79,142,247,0.2); border-color: rgba(79,142,247,0.4); color: var(--accent); font-weight: 600; }
        .calc-key.equals:hover { background: var(--accent); color: #fff; }

        /* === DIVIDER === */
        .divider {
          height: 1px;
          background: var(--border);
          margin: 4px 0 12px;
        }

        /* === Animations === */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(16px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* Mobile */
        @media (max-width: 480px) {
          .links-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
          .link-card { padding: 12px 4px 10px; }
          .link-label { font-size: 10px; }
          .link-icon { width: 30px; height: 30px; font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- CLOCK -->
    <div class="clock-section">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate">—</div>
    </div>

    <!-- MINI WEATHER -->
    <div class="mini-weather" id="miniWeather">
        <div class="mini-weather-row" id="mw-ba">
            <span class="mini-weather-city">Bratislava</span>
            <span class="mini-weather-icon" id="mw-ba-icon">⏳</span>
            <span class="mini-weather-temp" id="mw-ba-temp">—</span>
            <span class="mini-weather-extra" id="mw-ba-extra"></span>
        </div>
        <div class="mini-weather-row" id="mw-ko">
            <span class="mini-weather-city">Komárno</span>
            <span class="mini-weather-icon" id="mw-ko-icon">⏳</span>
            <span class="mini-weather-temp" id="mw-ko-temp">—</span>
            <span class="mini-weather-extra" id="mw-ko-extra"></span>
        </div>
    </div>

    <!-- QUICK LINKS -->
    <div class="links-section">
        <div class="links-grid">

            <a class="link-card spravy" href="https://mod3123.github.io/webcenter/Spravy/spravysk" target="_blank" title="Správy – Aktuality.sk">
        <span class="link-icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M6 8h8M6 12h12M6 16h9"/>
            <rect x="2" y="4" width="5" height="5" rx="0.5" fill="currentColor" opacity="0.3"/>
          </svg>
        </span>
                <span class="link-label">Správy</span>
            </a>

            <a class="link-card doprava" href="https://mod3123.github.io/webcenter/MHD/doprava" target="_blank" title="Doprava">
        <span class="link-icon">

<script>
    /* ========== MINI WEATHER (Open-Meteo) ========== */
    const WMO = {
      0:'Jasno',1:'Prevažne jasno',2:'Čiastočne oblačno',3:'Zamračené',
      45:'Hmla',48:'Ľadová hmla',
      51:'Slabé mrholenie',53:'Mrholenie',55:'Silné mrholenie',
      61:'Slabý dážď',63:'Dážď',65:'Silný dážď',
      71:'Slabý sneh',73:'Sneh',75:'Silný sneh',77:'Snehové vločky',
      80:'Slabé prehánky',81:'Prehánky',82:'Silné prehánky',
      85:'Snehové prehánky',86:'Silné sneh. prehánky',
      95:'Búrka',96:'Búrka s krúpami',99:'Silná búrka'
    };

    const WMO_ICON = {
      0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
      45:'🌫️',48:'🌫️',
      51:'🌦️',53:'🌦️',55:'🌧️',
      61:'🌧️',63:'🌧️',65:'🌧️',
      71:'🌨️',73:'❄️',75:'❄️',77:'❄️',
      80:'🌦️',81:'🌧️',82:'⛈️',
      85:'🌨️',86:'🌨️',
      95:'⛈️',96:'⛈️',99:'⛈️'
    };

    async function fetchMiniWeather(lat, lon, prefix) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m,relativehumidity_2m&wind_speed_unit=kmh&timezone=Europe%2FBratislava`;
        const res = await fetch(url);
        const data = await res.json();
        const c = data.current;
        const code = c.weathercode;
        const temp = Math.round(c.temperature_2m);
        const wind = Math.round(c.windspeed_10m);
        const hum = c.relativehumidity_2m;
        const desc = WMO[code] ?? 'Neznáme';
        const icon = WMO_ICON[code] ?? '🌡️';

        const shortDesc = desc.length > 12 ? desc.slice(0, 11) + '…' : desc;
        document.getElementById(`${prefix}-icon`).textContent = icon;
        document.getElementById(`${prefix}-temp`).textContent = `${temp > 0 ? '' : ''}${temp}°C`;
        document.getElementById(`${prefix}-extra`).innerHTML =
          `<span>💨 ${wind} km/h</span><span>💧 ${hum}%</span>`;
      } catch(e) {
        document.getElementById(`${prefix}-desc`).textContent = 'Chyba načítania';
        document.getElementById(`${prefix}-icon`).textContent = '⚠️';
      }
    }

    // Bratislava: 48.1482, 17.1067 | Komárno: 47.7631, 18.1289
    fetchMiniWeather(48.1482, 17.1067, 'mw-ba');
    fetchMiniWeather(47.7631, 18.1289, 'mw-ko');

    /* ========== CLOCK ========== */
    const DAYS = ['Nedeľa','Pondelok','Utorok','Streda','Štvrtok','Piatok','Sobota'];
    const MONTHS = ['januára','februára','marca','apríla','mája','júna','júla','augusta','septembra','októbra','novembra','decembra'];

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
      const d = DAYS[now.getDay()];
      const date = `${d}, ${now.getDate()}. ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
      document.getElementById('clockDate').textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* ========== WEATHER TOGGLE ========== */
    let weatherExpanded = false;
    function toggleWeather() {
      weatherExpanded = !weatherExpanded;
      const wrap = document.getElementById('weatherWrap');
      const btn = document.getElementById('weatherToggleBtn');
      if (weatherExpanded) {
        wrap.classList.add('expanded');
        btn.textContent = 'Zbaliť ↑';
        // Reload iframe to fit
        const iframe = document.getElementById('weatherFrame');
        iframe.src = iframe.src;
      } else {
        wrap.classList.remove('expanded');
        btn.textContent = 'Rozbaliť ↕';
      }
    }

    /* ========== CLEAR BUTTONS ========== */
    document.querySelectorAll('.search-box input').forEach(inp => {
      const row = inp.closest('.search-row') || inp.closest('.search-box');
      const clearBtn = inp.closest('.search-box').querySelector('.search-clear');
      if (!clearBtn) return;

      inp.addEventListener('input', () => {
        clearBtn.style.display = inp.value ? 'block' : 'none';
      });

      clearBtn.addEventListener('click', () => {
        inp.value = '';
        clearBtn.style.display = 'none';
        inp.focus();
      });
    });

    /* ========== GOOGLE SUGGESTIONS ========== */
    let jc = 0, dt = null, cs = [], fi = -1, mil = false;
    const gi = document.getElementById('googleInput');
    const sb = document.getElementById('googleSuggestions');

    function doGoogleSearch() {
      const q = gi.value.trim();
      if (!q) return;
      window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
    }

    function fetchSug(q) {
      if (!q.trim()) { closeSug(); return; }
      const cb = '__sg' + (++jc);
      const old = document.getElementById('__sgs'); if (old) old.remove();
      window[cb] = (data) => { delete window[cb]; cs = (data[1] || []).slice(0, 8); renderSug(q); };
      const s = document.createElement('script'); s.id = '__sgs';
      s.src = 'https://suggestqueries.google.com/complete/search?client=firefox&q=' + encodeURIComponent(q) + '&callback=' + cb;
      s.onerror = () => { delete window[cb]; };
      document.head.appendChild(s);
    }

    function renderSug(typed) {
      if (!cs.length) { closeSug(); return; }
      fi = -1; sb.innerHTML = '';
      const SUG_ITEM_H = 42;
      const fieldRect = gi.closest('.search-container').getBoundingClientRect();
      const spaceBelow = window.innerHeight - fieldRect.bottom - 12;
      let maxN = 1;
      for (let n = 1; n <= cs.length; n++) {
        const total = n * SUG_ITEM_H + (n - 1) * 1 + 16;
        if (total <= spaceBelow) maxN = n; else break;
      }
      const visible = cs.slice(0, maxN);
      visible.forEach((t, i) => {
        if (i > 0) { const d = document.createElement('div'); d.className = 'sug-divider'; sb.appendChild(d); }
        const b = document.createElement('button');
        b.className = 'sug-item'; b.setAttribute('role', 'option');
        b.innerHTML = '<span class="material-icons-round sug-icon">search</span><span class="sug-text">' +
          t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
          '</span><span class="material-icons-round sug-arrow">arrow_back</span>';
        b.addEventListener('mousedown', e => {
          e.preventDefault(); gi.value = t; closeSug();
          window.open('https://www.google.com/search?q=' + encodeURIComponent(t), '_blank');
        });
        b.addEventListener('mouseenter', () => { gi.value = t; setFoc(i); mil = true; });
        b.addEventListener('mouseleave', () => { mil = false; });
        sb.appendChild(b);
      });
      sb.classList.add('open');
    }

    function closeSug() { sb.classList.remove('open'); sb.innerHTML = ''; fi = -1; cs = []; }
    function setFoc(i) {
      const its = sb.querySelectorAll('.sug-item');
      its.forEach(e => e.classList.remove('focused'));
      if (i >= 0 && i < its.length) { its[i].classList.add('focused'); its[i].scrollIntoView({ block: 'nearest' }); }
      fi = i;
    }

    gi.addEventListener('input', () => {
      clearTimeout(dt);
      const v = gi.value;
      if (!v.trim()) { closeSug(); return; }
      dt = setTimeout(() => fetchSug(v), 200);
    });

    gi.addEventListener('keydown', e => {
      const its = sb.querySelectorAll('.sug-item'), len = its.length;
      if (e.key === 'ArrowDown') { e.preventDefault(); const n = (fi + 1) % len; setFoc(n); gi.value = cs[n]; }
      else if (e.key === 'ArrowUp') { e.preventDefault(); const p = fi <= 0 ? len - 1 : fi - 1; setFoc(p); gi.value = cs[p]; }
      else if (e.key === 'Enter') { e.preventDefault(); doGoogleSearch(); }
      else if (e.key === 'Escape') closeSug();
    });

    gi.addEventListener('focus', () => { if (gi.value.trim() && cs.length) sb.classList.add('open'); });
    gi.addEventListener('blur', () => { if (!mil) setTimeout(closeSug, 150); });
    document.addEventListener('click', e => {
      if (!e.target.closest('#googleSuggestions') && !e.target.closest('#googleInput')) closeSug();
    });

    /* ========== CALCULATOR ========== */
    const calcInput = document.getElementById('calcInput');
    const calcKeyboard = document.getElementById('calcKeyboard');
    const calcRow = document.getElementById('calcRow');

    calcInput.addEventListener('focus', () => calcKeyboard.classList.add('show'));

    function addCalc(s) { calcInput.value += s; calcInput.focus(); }
    function calcBackspace() { calcInput.value = calcInput.value.slice(0, -1); calcInput.focus(); }
    function calcClear() { calcInput.value = ''; calcInput.focus(); }
    function closeCalc() { calcKeyboard.classList.remove('show'); calcInput.blur(); }

    function calcEval() {
      try {
        let expr = calcInput.value.replace(/\^/g, '**');
        calcInput.value = Function('"use strict";return (' + expr + ')')();
      } catch(e) {
        calcInput.value = '❌ Neplatný výraz';
      }
    }

    calcInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); calcEval(); }
      else if (e.key === 'Escape') closeCalc();
    });

    document.addEventListener('click', e => {
      if (!calcRow.contains(e.target)) closeCalc();
    });

    calcKeyboard.addEventListener('click', e => e.stopPropagation());

    /* ========== FORM EMPTY PREVENT ========== */
    document.querySelectorAll('form').forEach(f => {
      f.addEventListener('submit', e => {
        const inp = f.querySelector('input');
        if (!inp || !inp.value.trim()) e.preventDefault();
      });
    });
</script>
