<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Správy SK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Roboto+Flex:opsz,wdth,wght@8..144,75..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --md-primary: #0061A4;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #D1E4FF;
    --md-on-primary-container: #001D36;
    --md-secondary: #4A6480;
    --md-on-secondary: #FFFFFF;
    --md-secondary-container: #D6E3F7;
    --md-on-secondary-container: #111C2B;
    --md-surface: #F8FAFE;
    --md-on-surface: #181C20;
    --md-surface-variant: #DDE3EA;
    --md-on-surface-variant: #3A4450;
    --md-surface-container-lowest: #FFFFFF;
    --md-surface-container-low: #EFF3F8;
    --md-surface-container: #E9EEF4;
    --md-surface-container-high: #E2E8EF;
    --md-surface-container-highest: #DCE2EA;
    --md-outline: #6E7A87;
    --md-outline-variant: #BCC5CF;
    --md-error: #BA1A1A;

    --elev-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.1);
    --elev-2: 0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.12);
    --elev-3: 0 4px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.1);
    --elev-4: 0 8px 16px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.08);

    --radius-xs: 8px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 28px;
    --radius-full: 50px;

    --cols: 3;
    --gap: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary: #9ECAFF;
      --md-on-primary: #003258;
      --md-primary-container: #00497D;
      --md-on-primary-container: #D1E4FF;
      --md-secondary: #A0BEDB;
      --md-on-secondary: #1A3349;
      --md-secondary-container: #2E3E50;
      --md-on-secondary-container: #D6E3F7;
      --md-surface: #101418;
      --md-on-surface: #DCE2EA;
      --md-surface-variant: #3A4450;
      --md-on-surface-variant: #BCC5CF;
      --md-surface-container-lowest: #0B0F12;
      --md-surface-container-low: #181C20;
      --md-surface-container: #1C2026;
      --md-surface-container-high: #262B30;
      --md-surface-container-highest: #31363B;
      --md-outline: #8A9299;
      --md-outline-variant: #3A4450;
      --md-error: #FFB4AB;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--md-surface);
    color: var(--md-on-surface);
    font-family: 'Nunito', -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  button, a { -webkit-tap-highlight-color: transparent; outline: none; -webkit-appearance: none; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--md-surface-container-low); }
  ::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 5px; border: 2px solid var(--md-surface-container-low); }
  ::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }

  /* ── SOURCE SELECTION ── */
  #source-selection {
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 80px; min-height: 100vh;
    animation: fadeUp .5s cubic-bezier(.34,1.56,.64,1) both;
  }

  .app-header {
    width: 100%; max-width: 900px; margin-bottom: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  .app-logo {
    width: 72px; height: 72px;
    background: var(--md-primary-container);
    border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; box-shadow: var(--elev-2);
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .1s both;
  }

  .app-title {
    font-family: 'Roboto Flex', sans-serif;
    font-size: 3rem; font-weight: 800; letter-spacing: -0.04em;
    color: var(--md-on-surface);
    animation: fadeUp .5s ease .2s both;
  }

  .featured-actions {
    width: 100%; max-width: 900px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-bottom: 28px;
  }

  .featured-btn {
    border: none; border-radius: var(--radius-xl); padding: 0;
    cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800;
    display: flex; flex-direction: column; align-items: flex-start;
    transition: filter .18s ease, box-shadow .18s ease;
    position: relative; overflow: hidden;
    min-height: 160px; justify-content: flex-end;
    box-shadow: var(--elev-2); text-align: left;
  }

  .featured-btn:active { filter: brightness(.92); }
  .featured-btn:hover { box-shadow: var(--elev-4); filter: brightness(1.04); }
  .featured-btn.all-news { background: linear-gradient(135deg, #1565C0 0%, #0061A4 60%, #00497D 100%); color: #fff; }
  .featured-btn.sports { background: linear-gradient(135deg, #1B7A3E 0%, #146B34 60%, #0D4D25 100%); color: #C8F5D8; }
  .featured-btn.websites { background: linear-gradient(135deg, #6B3FA0 0%, #5A2D91 60%, #3E1A6E 100%); color: #E8D8FF; }

  .featured-btn .feat-bg-icon {
    position: absolute; right: -8px; top: -4px;
    font-size: 5.5rem; opacity: .18; line-height: 1;
    pointer-events: none; user-select: none;
  }

  .feat-content {
    position: relative; z-index: 1;
    padding: 18px 18px 20px;
    display: flex; flex-direction: column; gap: 4px; width: 100%;
  }

  .featured-btn .feat-icon { font-size: 1.9rem; line-height: 1; margin-bottom: 4px; }
  .featured-btn .feat-label { font-size: 1.05rem; font-weight: 900; line-height: 1.2; letter-spacing: -.01em; }
  .featured-btn .feat-sub { font-size: .78rem; font-weight: 600; opacity: .75; line-height: 1.3; }

  .source-grid-wrap { width: 100%; max-width: 900px; }

  .source-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }

  .source-btn {
    background: var(--md-surface-container-low);
    border: 1.5px solid var(--md-outline-variant);
    border-radius: var(--radius-lg);
    padding: 18px 10px 14px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif; font-size: .8rem; font-weight: 700;
    color: var(--md-on-surface);
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; min-height: 110px; text-align: center;
    box-shadow: var(--elev-1); position: relative; overflow: hidden;
  }

  .source-btn:hover {
    border-color: var(--md-primary);
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
    box-shadow: var(--elev-2);
  }

  .source-btn:active { filter: brightness(.93); }

  .source-icon {
    width: 52px; height: 52px;
    object-fit: contain; border-radius: 12px;
    background: var(--md-surface-container); padding: 2px;
  }

  /* ── CONTENT VIEW ── */
  #content-view { display: none; }
  #content-view.active { display: block; }

  .top-app-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--md-surface-container);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--md-outline-variant);
    padding: 12px 16px;
  }

  .top-bar-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
  }

  .back-btn {
    background: var(--md-surface-container-high);
    border: none; border-radius: var(--radius-full);
    width: 44px; height: 44px; cursor: pointer;
    font-size: 1.2rem; color: var(--md-on-surface);
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: var(--elev-1);
  }

  .back-btn:hover { background: var(--md-primary-container); color: var(--md-on-primary-container); transform: scale(1.08); }

  .bar-title {
    font-family: 'Roboto Flex', sans-serif; font-weight: 800;
    font-size: 1.2rem; letter-spacing: -.02em;
    flex-shrink: 0; color: var(--md-on-surface);
  }

  .search-wrap { flex: 1; position: relative; }

  .search-wrap input {
    width: 100%; padding: 10px 16px 10px 44px;
    border-radius: var(--radius-full);
    border: 1.5px solid var(--md-outline-variant);
    background: var(--md-surface-container-highest);
    color: var(--md-on-surface);
    font-family: 'Nunito', sans-serif; font-weight: 600; font-size: .95rem;
    transition: border-color .2s ease, background .2s ease;
    box-shadow: var(--elev-1);
  }

  .search-wrap input:focus {
    outline: none; border-color: var(--md-primary);
    background: var(--md-surface-container-low);
    box-shadow: 0 0 0 3px rgba(0,97,164,.18);
  }

  .search-wrap input::placeholder { color: var(--md-on-surface-variant); opacity: .7; }

  .search-icon-bar {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 1.1rem; color: var(--md-on-surface-variant); pointer-events: none;
  }

  .view-toggle {
    display: flex; background: var(--md-surface-container-high);
    border-radius: var(--radius-full); padding: 3px; gap: 2px;
    box-shadow: var(--elev-1); flex-shrink: 0;
  }

  .view-mode-btn {
    border: none; background: transparent; border-radius: var(--radius-full);
    padding: 7px 14px; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .82rem;
    color: var(--md-on-surface-variant);
    transition: all .2s cubic-bezier(.34,1.56,.64,1); white-space: nowrap;
  }

  .view-mode-btn.active { background: var(--md-primary); color: var(--md-on-primary); box-shadow: var(--elev-2); }

  .stats-bar {
    max-width: 1400px; margin: 14px auto 0; padding: 0 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }

  .stats-chip {
    background: var(--md-surface-container);
    border: 1px solid var(--md-outline-variant);
    border-radius: var(--radius-full);
    padding: 5px 14px; font-size: .8rem; font-weight: 700;
    color: var(--md-on-surface-variant);
  }

  /* ── MASONRY WRAPPER ──
     3 flex columns, cards flow left→right by JS assignment.
     No CSS columns = no reflow jank when images load.
  */
  #rss-feed {
    max-width: 1400px;
    margin: 16px auto 80px;
    padding: 0 16px;
    display: flex;
    gap: var(--gap);
    align-items: flex-start;
  }

  .masonry-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    min-width: 0;
  }

  /* CARDS — no pop animation to avoid reflow flicker */
  .item-card {
    background: var(--md-surface-container-low);
    border: 1.5px solid var(--md-outline-variant);
    border-radius: var(--radius-xl);
    display: flex; flex-direction: column;
    box-shadow: var(--elev-1);
    overflow: hidden;
    /* will-change keeps GPU layer stable during scroll */
    will-change: transform;
    transition: box-shadow .18s ease, border-color .18s ease;
  }

  .item-card:hover { box-shadow: var(--elev-3); border-color: var(--md-primary); }

  /* Fixed aspect-ratio container prevents layout shift when image loads */
  .item-thumb-wrap {
    width: 100%;
    /* 16:9 placeholder — collapses if no image */
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--md-surface-container);
    flex-shrink: 0;
  }

  .item-thumb-wrap.no-media { display: none; }

  .item-thumb {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    /* fade in once loaded — no layout shift */
    opacity: 0;
    transition: opacity .25s ease;
  }

  .item-thumb.loaded { opacity: 1; }

  video.item-thumb { opacity: 1; }

  .item-content {
    padding: 16px 18px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .item-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .m3-chip {
    border-radius: var(--radius-full); padding: 4px 10px;
    font-size: .72rem; font-weight: 800; letter-spacing: .03em; border: 1px solid;
  }

  .m3-chip.date { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }
  .m3-chip.source { background: var(--md-primary-container); color: var(--md-on-primary-container); border-color: transparent; }

  .item-content h2 {
    font-family: 'Roboto Flex', sans-serif; font-size: 1.05rem; font-weight: 750;
    line-height: 1.35; letter-spacing: -.015em; color: var(--md-on-surface);
  }

  .item-content h2 a { text-decoration: none; color: inherit; transition: color .15s ease; }
  .item-content h2 a:hover { color: var(--md-primary); }

  .item-desc { font-size: .875rem; color: var(--md-on-surface-variant); line-height: 1.55; }

  .read-more-btn {
    display: block; width: 100%; padding: 11px;
    background: var(--md-primary); color: var(--md-on-primary);
    border: none; border-radius: var(--radius-md); text-align: center;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .9rem;
    text-decoration: none; cursor: pointer;
    transition: background .2s ease;
    letter-spacing: .01em; box-shadow: var(--elev-1);
    margin-top: auto;
  }

  .read-more-btn:hover { background: var(--md-on-primary-container); }

  /* Loading / message spans all cols */
  .feed-message {
    flex: 1;
    background: var(--md-surface-container-low);
    border: 1.5px solid var(--md-outline-variant);
    border-radius: var(--radius-xl);
    padding: 48px 24px; text-align: center;
    color: var(--md-on-surface-variant); font-weight: 700; font-size: 1rem;
    box-shadow: var(--elev-1);
  }

  .loading-msg { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 100px; }

  .dot {
    width: 12px; height: 12px; background: var(--md-primary);
    border-radius: 50%; animation: m3bounce 1.4s infinite cubic-bezier(.36,.07,.19,.97) both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes m3bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  /* Load-more sentinel */
  #load-sentinel { height: 1px; margin-bottom: 80px; }

  /* Compact view — single list */
  #rss-feed.compact-view { flex-direction: column; }
  #rss-feed.compact-view .masonry-col { flex-direction: column; }
  #rss-feed.compact-view .item-card { flex-direction: row; }
  #rss-feed.compact-view .item-thumb-wrap { width: 140px; aspect-ratio: unset; min-height: 130px; flex-shrink: 0; }
  #rss-feed.compact-view .item-content { padding: 12px 16px; }
  #rss-feed.compact-view .item-desc {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

  @media (max-width: 1100px) { :root { --cols: 2; } }

  @media (max-width: 768px) {
    :root { --cols: 1; }
    .app-title { font-size: 2.2rem; }
    .featured-actions { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .featured-btn { min-height: 100px; }
    .featured-btn .feat-icon { font-size: 2rem; }
    .featured-btn .feat-label { font-size: .82rem; }
    .featured-btn .feat-sub { display: none; }
    #rss-feed.compact-view .item-card { flex-direction: column; }
    #rss-feed.compact-view .item-thumb-wrap { width: 100%; aspect-ratio: 16/9; min-height: unset; }
    .top-bar-inner { flex-wrap: wrap; }
    .bar-title { display: none; }
    .search-wrap { order: 3; flex: 1 1 100%; }
    .view-toggle { margin-left: auto; order: 2; width: calc(100% - 44px - 12px); }
    .view-mode-btn { flex: 1; text-align: center; }
  }

  @media (max-width: 480px) {
    #source-selection { padding: 20px 12px 60px; }
    .source-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .source-btn { min-height: 100px; padding: 14px 8px; font-size: .75rem; }
  }
</style>
</head>
<body>

<!-- SOURCE SELECTION -->
<div id="source-selection">
  <div class="app-header">
    <div class="app-logo">📰</div>
    <h1 class="app-title">Správy SK</h1>
  </div>

  <div class="featured-actions">
    <button class="featured-btn all-news" id="btn-all">
      <span class="feat-bg-icon">📰</span>
      <div class="feat-content">
        <span class="feat-icon">📰</span>
        <span class="feat-label">Všetky správy</span>
        <span class="feat-sub">Zobraziť všetky správy</span>
      </div>
    </button>
    <button class="featured-btn sports" id="btn-sport">
      <span class="feat-bg-icon">⚽</span>
      <div class="feat-content">
        <span class="feat-icon">⚽</span>
        <span class="feat-label">Šport</span>
        <span class="feat-sub">Športové správy</span>
      </div>
    </button>
    <button class="featured-btn websites" id="btn-webs">
      <span class="feat-bg-icon">🌐</span>
      <div class="feat-content">
        <span class="feat-icon">🌐</span>
        <span class="feat-label">Spravodajské weby</span>
        <span class="feat-sub">Zoznam spravodajských stránok</span>
      </div>
    </button>
  </div>

  <div class="source-grid-wrap">
    <div class="source-grid" id="source-grid"></div>
  </div>
</div>

<!-- CONTENT VIEW -->
<div id="content-view">
  <div class="top-app-bar">
    <div class="top-bar-inner">
      <button class="back-btn" id="back-btn" title="Späť">←</button>
      <span class="bar-title" id="bar-title">Správy</span>
      <div class="search-wrap">
        <span class="search-icon-bar">🔍</span>
        <input type="text" id="search-input" placeholder="Hľadať">
      </div>
      <div class="view-toggle">
        <button class="view-mode-btn active" data-view="grid">⊞ Mriežka</button>
        <button class="view-mode-btn" data-view="compact">≡ Kompakt</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <span class="stats-chip" id="count-info">Načítavam…</span>
    <span class="stats-chip" id="last-update"></span>
  </div>

  <div id="rss-feed">
    <div class="feed-message loading-msg">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
  <div id="load-sentinel"></div>
</div>

      "https://ereport.sk/feed","https://standard.sk/feed","https://www.postoj.sk/rss",
      "https://cz24.news/feed/","https://www.seznamzpravy.cz/rss","https://www.satelitnatv.sk/feed","https://ct24.ceskatelevize.cz/rss",
      "https://www.istream.sk/feed","https://imhd.sk/ba/rss/dokumenty","https://www.bratislavskyvecernik.sk/feed","https://marker.sk/rss"
    ],
    "Šport": ["https://isport.blesk.cz/rss","https://sportweb.pravda.sk/rss/xml/","https://www.sport.cz/rss2","https://sport.aktuality.sk/api/rss"],
    "eReport": ["https://ereport.sk/feed"],
    "Pravda.sk": ["https://spravy.pravda.sk/rss/xml"],
    "SME.sk": ["https://domov.sme.sk/rss"],
    "Teraz.sk": ["https://www.teraz.sk/rss/vsetky-spravy.rss"],
    "Startitup": ["https://www.startitup.sk/feed/"],
    "TA3": ["https://www.ta3.com/rss/5/spravy"],
    "iStream.sk": ["https://www.istream.sk/feed"],
    "Info.sk": ["https://www.info.sk/rss/"],
    "Aktuality.sk": ["https://www.aktuality.sk/rss/"],
    "SITA": ["https://sita.sk/feed/"],
    "Refresher": ["https://refresher.sk/rss"],
    "Marker.sk": ["https://marker.sk/rss"],
    "Novinky.cz": ["https://www.novinky.cz/rss"],
    "Seznam Zprávy": ["https://www.seznamzpravy.cz/rss"],
    "iMeteo": ["https://www.imeteo.sk/rss/news"],
    "České Noviny": ["https://www.ceskenoviny.cz/sluzby/rss/zpravy.php"],
    "ČT 24": ["https://ct24.ceskatelevize.cz/rss"],
    "CZ24.news": ["https://cz24.news/feed/"],
    "Športweb": ["https://sportweb.pravda.sk/rss/xml/"],
    "TouchIT": ["https://touchit.sk/feed"],
    "Živé.sk": ["https://zive.aktuality.sk/rss/najnovsie/"],
    "Zive.cz": ["https://www.zive.cz/rss"],
    "Reflex": ["https://www.reflex.cz/rss"],
    "AndroidPortal": ["https://androidportal.sk/feed"],
    "RTVS": ["https://spravy.stvr.sk/feed/"],
    "Blesk.cz": ["https://www.blesk.cz/rss"],
    "Standard": ["https://standard.sk/feed"],
    "Satelitná TV": ["https://www.satelitnatv.sk/feed"],
    "iMHD.sk BA": ["https://imhd.sk/ba/rss/dokumenty"],
    "Bratislavský večerník": ["https://www.bratislavskyvecernik.sk/feed"],
    "Postoj": ["https://www.postoj.sk/rss"],
    "Záhrada.sk": ["https://www.zahrada.sk/feed"],
    "Denník N": ["https://dennikn.sk/rss"]
  };

  const PAGE_SIZE = 15;
  let allItems = [], filteredItems = [], renderIndex = 0;
  let searchQuery = '', selectedSource = null;
  let isCompact = false;
  let renderPending = false;

  const URL_TO_NAME = {};
  Object.entries(FEEDS).forEach(([name, urls]) => {
    if (name === 'Všetky správy' || name === 'Šport') return;
    urls.forEach(url => { URL_TO_NAME[url] = name; });
  });

  const sourceSelection = document.getElementById("source-selection");
  const contentView     = document.getElementById("content-view");
  const sourceGrid      = document.getElementById("source-grid");
  const feed            = document.getElementById("rss-feed");
  const searchInput     = document.getElementById("search-input");
  const countInfo       = document.getElementById("count-info");
  const lastUpdate      = document.getElementById("last-update");
  const backBtn         = document.getElementById("back-btn");
  const barTitle        = document.getElementById("bar-title");
  const sentinel        = document.getElementById("load-sentinel");

  /* ── Columns state ── */
  let cols = [];
  const NUM_COLS = () => window.innerWidth <= 768 ? 1 : window.innerWidth <= 1100 ? 2 : 3;

  function buildColumns() {
    feed.innerHTML = '';
    cols = [];
    const n = isCompact ? 1 : NUM_COLS();
    for (let i = 0; i < n; i++) {
      const col = document.createElement('div');
      col.className = 'masonry-col';
      feed.appendChild(col);
      cols.push(col);
    }
  }

  /* Card goes to shortest column (by scrollHeight) for true masonry balance,
     but cards are assigned in left→right row order so the most recent always
     appears top-left. */
  function getTargetCol(cardIndex) {
    if (isCompact || cols.length === 1) return cols[0];
    // left-to-right: card 0→col0, card 1→col1, card 2→col2, card 3→col0 ...
    // BUT we pick the shortest to maintain balance while keeping order intuitive.
    // For strict LTR order we simply use modulo:
    return cols[cardIndex % cols.length];
  }

  /* ── Navigation ── */
  function showSourceMenu() {
    sourceSelection.style.display = 'flex';
    contentView.classList.remove('active');
    window.scrollTo(0, 0);
  }

  function showContent() {
    sourceSelection.style.display = 'none';
    contentView.classList.add('active');
  }

  function getDomain(url) {
    try { return new URL(url).hostname; } catch(e) { return ''; }
  }

  function cleanDesc(text) {
    text = text.replace(/The post .+ appeared first on .+\.\s*$/i, '').trim();
    text = text.replace(/Článok .+ ako prv[ýý] na .+\.\s*$/i, '').trim();
    return text;
  }

  /* ── Source menu ── */
  function initSourceMenu() {
    sourceGrid.innerHTML = '';
    document.getElementById('btn-all').onclick   = () => selectSource('Všetky správy');
    document.getElementById('btn-sport').onclick = () => selectSource('Šport');
    document.getElementById('btn-webs').onclick  = () => window.open('https://no-ship-it26.github.io/webcenter/spravodajske_weby', '_blank');

    Object.keys(FEEDS).forEach(name => {
      if (name === 'Všetky správy' || name === 'Šport') return;
      const domain   = getDomain(FEEDS[name][0]);
      const iconHtml = CUSTOM_LOGOS[name]
        ? `<img src="${CUSTOM_LOGOS[name]}" class="source-icon" alt="${name}">`
        : `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=128" class="source-icon" alt="${name}" onerror="this.style.display='none'">`;
      const btn = document.createElement('button');
      btn.className = 'source-btn';
      btn.innerHTML = `${iconHtml}<span>${name}</span>`;
      btn.onclick = () => selectSource(name);
      sourceGrid.appendChild(btn);
    });
  }

  /* ── Select source & fetch ── */
  let currentSession = 0;

  function showSpinner() {
    feed.innerHTML = '<div class="feed-message loading-msg"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    cols = [];
  }

  async function selectSource(name) {
    selectedSource = name;
    barTitle.textContent = name;
    showContent();
    allItems = []; filteredItems = []; renderIndex = 0;
    renderPending = false;
    searchInput.value = ''; searchQuery = '';
    const session = ++currentSession;

    showSpinner();
    countInfo.textContent = 'Nacitavam…';
    lastUpdate.textContent = name + ' • ' + new Date().toLocaleTimeString('sk-SK');

    const results = await Promise.all(FEEDS[name].map(fetchXMLFeed));
    if (session !== currentSession) return;

    allItems = results.flat().sort((a, b) => b.pubDate - a.pubDate);
    applyFilters();
  }

  /* ── Filtering ── */
  function applySearch(items) {
    if (!searchQuery) return items;
    const q = searchQuery.toLowerCase();
    return items.filter(i =>
      i.title.toLowerCase().includes(q) ||
      i.desc.toLowerCase().includes(q) ||
      i.source.toLowerCase().includes(q)
    );
  }

  function applyFilters() {
    filteredItems = applySearch(allItems);
    renderIndex = 0;
    renderPending = false;
    buildColumns();
    updateStats();
    if (filteredItems.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'feed-message';
      msg.textContent = allItems.length === 0
        ? 'Chyba nacítania alebo žiadne výsledky.'
        : 'Žiadne výsledky pre hľadaný výraz.';
      feed.appendChild(msg);
      return;
    }
    renderBatch();
  }

  function updateStats() {
    const shown = Math.min(renderIndex, filteredItems.length);
    countInfo.textContent = `${shown} z ${filteredItems.length} článkov`;
    lastUpdate.textContent = `${selectedSource} • ${new Date().toLocaleTimeString('sk-SK')}`;
  }

  /* ── Render batch of cards ── */
  function renderBatch() {
    if (renderPending) return;
    if (renderIndex >= filteredItems.length) {
      updateStats();
      return;
    }

    renderPending = true;
    // Use requestAnimationFrame to batch DOM writes, avoiding mid-paint jank
    requestAnimationFrame(() => {
      const batch = filteredItems.slice(renderIndex, renderIndex + PAGE_SIZE);
      const fragment = document.createDocumentFragment();

      // Pre-build all cards into a fragment first, then append in one shot
      batch.forEach((item, batchIdx) => {
        const globalIdx = renderIndex + batchIdx;
        const card = buildCard(item);
        // store target column index on card for later appendChild
        card._colIdx = globalIdx % cols.length;
        fragment.appendChild(card); // temporarily hold
      });

      // Append each card to its column (still batched in one rAF)
      const cards = Array.from(fragment.children);
      cards.forEach(card => {
        const colIdx = isCompact ? 0 : card._colIdx;
        cols[Math.min(colIdx, cols.length - 1)].appendChild(card);
      });

      renderIndex += batch.length;
      renderPending = false;
      updateStats();
    });
  }

  /* ── Build a single card DOM node ── */
  function buildCard(i) {
    const card = document.createElement('div');
    card.className = 'item-card';

    const badgeDate = `${i.pubDate.toLocaleDateString('sk-SK')} ${i.pubDate.toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'})}`;

    // Media section
    let mediaHtml = '';
    if (i.video) {
      mediaHtml = `<div class="item-thumb-wrap"><video class="item-thumb" data-src="${i.video}" controls preload="metadata"></video></div>`;
    } else if (i.thumb) {
      // aspect-ratio container prevents layout shift; image fades in when loaded
      mediaHtml = `<div class="item-thumb-wrap"><img class="item-thumb" data-src="${i.thumb}" alt="" loading="lazy"></div>`;
    } else {
      mediaHtml = `<div class="item-thumb-wrap no-media"></div>`;
    }

    card.innerHTML = `
      ${mediaHtml}
      <div class="item-content">
        <h2><a href="${i.link}" target="_blank" rel="noopener noreferrer">${i.title}</a></h2>
        <div class="item-badges">
          <span class="m3-chip date">🕐 ${badgeDate}</span>
          <span class="m3-chip source">${i.source}</span>
        </div>
        <p class="item-desc">${i.desc}${i.desc.length >= 590 ? '…' : ''}</p>
        <a class="read-more-btn" href="${i.link}" target="_blank" rel="noopener noreferrer">Čítať článok</a>
      </div>
    `;

    // Lazy-load image via IntersectionObserver (no src until visible)
    const img = card.querySelector('img.item-thumb');
    if (img) imgObserver.observe(img);

    const vid = card.querySelector('video.item-thumb');
    if (vid) vidObserver.observe(vid);

    return card;
  }

  /* ── Lazy image observer ── */
  const imgObserver = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const img = e.target;
      img.src = img.dataset.src;
      img.onload  = () => img.classList.add('loaded');
      img.onerror = () => { img.closest('.item-thumb-wrap')?.classList.add('no-media'); };
      obs.unobserve(img);
    });
  }, { rootMargin: '300px' });

  /* ── Lazy video observer ── */
  const vidObserver = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const v = e.target;
      v.src = v.dataset.src; v.load();
      obs.unobserve(v);
    });
  }, { rootMargin: '200px' });

  /* ── Infinite scroll via IntersectionObserver (no scroll event!) ── */
  const sentinelObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) renderBatch();
  }, { rootMargin: '400px' });
  sentinelObserver.observe(sentinel);

  /* ── Network timeout helper ── */
  function getNetworkTimeout() {
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (!conn) return 9000;
    const type = conn.effectiveType || '', dl = conn.downlink || 0;
    if (type === 'slow-2g' || type === '2g' || dl < 0.5) return 40000;
    if (type === '4g' && dl >= 5) return 5000;
    return 9000;
  }

  /* ── Fetch & parse RSS ── */
  async function fetchXMLFeed(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), getNetworkTimeout());
    try {
      const res  = await fetch('https://spravysk.peniaskomano.workers.dev/?url=' + encodeURIComponent(url), { signal: ctrl.signal });
      clearTimeout(timer);
      const text = await res.text();
      const xml  = new DOMParser().parseFromString(text, 'text/xml');
      const source = URL_TO_NAME[url] || xml.querySelector('channel > title')?.textContent || url;

      return [...xml.querySelectorAll('item')].map(item => {
        let pub = new Date(
          item.querySelector('pubDate')?.textContent ||
          item.querySelector('updated')?.textContent ||
          item.querySelector('[dc\\:date]')?.textContent ||
          item.querySelector('date')?.textContent || ''
        );
        if (isNaN(pub)) pub = new Date(0);

        let thumb = '', video = '';

        const enc = item.querySelector('enclosure');
        if (enc) {
          const t = enc.getAttribute('type') || '', u = enc.getAttribute('url') || '';
          if (t.startsWith('image')) thumb = u;
          else if (t.startsWith('video')) video = u;
        }
        if (!thumb) { const tg = item.querySelector('thumbnail'); if (tg) thumb = tg.textContent.trim(); }
        if (!thumb) { const si = item.querySelector('image url, szn\\:image szn\\:url'); if (si) thumb = si.textContent.trim(); }
        if (!thumb && !video) {
          const mc = item.querySelector('media\\:content, content');
          if (mc) {
            const t = mc.getAttribute('type') || '', u = mc.getAttribute('url') || '';
            if (t.startsWith('image')) thumb = u;
            else if (t.startsWith('video')) video = u;
          }
        }
        if (!thumb) {
          const dh = item.querySelector('description')?.textContent || '';
          const im = dh.match(/<img[^>]+src="([^">]+)"/);
          if (im) thumb = im[1];
          if (!video) {
            const vm = dh.match(/<video[^>]+src="([^">]+)"/);
            if (vm) video = vm[1];
            else {
              const ifm = dh.match(/<iframe[^>]+src="([^">]+)"/);
              if (ifm && (ifm[1].includes('youtube') || ifm[1].includes('vimeo'))) video = ifm[1];
            }
          }
        }

        let raw = (item.querySelector('description')?.textContent || '').replace(/<[^>]*>/g, '').trim();
        raw = cleanDesc(raw);
        let desc = raw.slice(0, 1000);
        if (raw.length > 1000) { const ls = desc.lastIndexOf(' '); if (ls > 0) desc = desc.slice(0, ls); }

        return {
          title: item.querySelector('title')?.textContent || '',
          link:  item.querySelector('link')?.textContent  || '',
          desc, pubDate: pub, source, thumb, video
        };
      }).filter(i => i.title && i.link);
    } catch(e) {
      clearTimeout(timer);
      console.warn('Feed error:', url, e.message);
      return [];
    }
  }

  /* ── Back button ── */
  backBtn.addEventListener('click', showSourceMenu);

  /* ── View toggle (grid ↔ compact) ── */
  document.querySelectorAll('.view-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      isCompact = btn.dataset.view === 'compact';
      feed.classList.toggle('compact-view', isCompact);
      // Rebuild columns & re-render
      renderIndex = 0;
      buildColumns();
      renderBatch();
    });
  });

  /* ── Search ── */
  let searchTimer;
  searchInput.addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 300);
  });

  /* ── Resize: rebuild column count ── */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!selectedSource) return;
      renderIndex = 0;
      buildColumns();
      renderBatch();
    }, 200);
  });

  /* ── Init ── */
  initSourceMenu();
})();
</script>
