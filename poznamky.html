
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poznámky</title>

<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-ancestors *;" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..900&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --pri:#3A6B35; --on-pri:#FFFFFF; --pri-c:#BCF0AE; --on-pri-c:#072100;
    --sec:#53634A; --on-sec:#FFFFFF; --sec-c:#D6E8C8; --on-sec-c:#111F0B;
    --ter:#2D6570; --on-ter:#FFFFFF; --ter-c:#BBEBF0; --on-ter-c:#001F24;
    --err:#BA1A1A; --on-err:#FFFFFF; --err-c:#FFDAD6; --on-err-c:#410002;
    --surf:#F7FBEF; --surf-dim:#D7DBCF; --surf-bright:#F7FBEF;
    --surf-c-low:#F1F4E9; --surf-c:#EBEEE3; --surf-c-high:#E5E9DD; --surf-c-highest:#DFE3D8;
    --on-surf:#1A1C18; --on-surf-var:#43483E;
    --outline:#73796C; --outline-var:#C3C8B9;
    --shadow: 0 1px 2px rgba(0,0,0,.15), 0 2px 6px 1px rgba(0,0,0,.10);
    --shadow-lg: 0 4px 8px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.18);
    --ease-em: cubic-bezier(0.2,0.0,0,1.0);
    --ease-spring: cubic-bezier(0.34,1.4,0.4,1);
    --r-xs:8px; --r-sm:14px; --r-md:20px; --r-lg:28px; --r-xl:36px;
  }
  html[data-theme="dark"]{
    --pri:#A1D392; --on-pri:#0D3900; --pri-c:#215318; --on-pri-c:#BCF0AE;
    --sec:#BACAAC; --on-sec:#263420; --sec-c:#3B4B32; --on-sec-c:#D6E8C8;
    --ter:#A0CFD4; --on-ter:#003640; --ter-c:#144D55; --on-ter-c:#BBEBF0;
    --err:#FFB4AB; --on-err:#690005; --err-c:#93000A; --on-err-c:#FFDAD6;
    --surf:#12140F; --surf-dim:#12140F; --surf-bright:#383A33;
    --surf-c-low:#1A1C17; --surf-c:#1E201B; --surf-c-high:#282A25; --surf-c-highest:#33352F;
    --on-surf:#E2E3DA; --on-surf-var:#C3C8B9;
    --outline:#8D9285; --outline-var:#43483E;
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 2px 8px 1px rgba(0,0,0,.4);
    --shadow-lg: 0 4px 10px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; height:100vh; overflow:hidden;
    font-family:'Inter',sans-serif; color:var(--on-surf); background:var(--surf);
    transition: background .4s var(--ease-em), color .4s var(--ease-em);
  }
  h1,h2,.display{ font-family:'Roboto Flex', sans-serif; font-variation-settings:'wght' 650, 'opsz' 32; letter-spacing:-.02em; }

  .app{ display:flex; flex-direction:column; height:100vh; }

  .icon-btn{
    width:40px; height:40px; border-radius:var(--r-md); border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--on-surf-var);
    transition: background .25s var(--ease-em), border-radius .25s var(--ease-spring), color .2s;
    flex:none;
  }
  .icon-btn:hover{ background:var(--surf-c-high); }
  .icon-btn:active{ border-radius:var(--r-xs); background:var(--surf-c-highest); }
  .icon-btn svg{ width:20px; height:20px; }

  /* ============ TAB BAR ============ */
  .tab-bar{
    display:flex; align-items:flex-end; gap:2px; padding:10px 12px 0; background:var(--surf-c-low);
    overflow-x:auto; flex:none; scrollbar-width:none;
  }
  .tab-bar::-webkit-scrollbar{ display:none; }
  .tab{
    display:flex; align-items:center; gap:8px; max-width:220px; min-width:130px; flex:none;
    padding:11px 10px 11px 16px; background:var(--surf-c-high); color:var(--on-surf-var);
    border-radius:var(--r-md) var(--r-md) 0 0; cursor:pointer; position:relative; user-select:none;
    transition: background .22s var(--ease-em), color .2s, transform .18s var(--ease-spring);
  }
  .tab:hover{ background:var(--surf-c-highest); }
  .tab.active{ background:var(--surf); color:var(--on-surf); font-weight:600; }
  .tab-label{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
  .tab-close{
    width:22px; height:22px; border:none; background:transparent; border-radius:8px; flex:none;
    display:flex; align-items:center; justify-content:center; color:inherit; opacity:.6; cursor:pointer;
    transition: background .18s, opacity .18s, border-radius .2s var(--ease-spring);
  }
  .tab-close:hover{ opacity:1; background:rgba(0,0,0,.1); border-radius:50%; }
  .tab-close svg{ width:13px; height:13px; }
  .tab-add{
    display:flex; align-items:center; justify-content:center; width:38px; height:38px; margin-bottom:2px;
    border:none; background:transparent; color:var(--on-surf-var); border-radius:var(--r-sm); cursor:pointer; flex:none;
    transition: background .2s, border-radius .2s var(--ease-spring);
  }
  .tab-add:hover{ background:var(--surf-c-high); }
  .tab-add svg{ width:18px; height:18px; }

  /* ============ EDITOR ============ */
  .editor-pane{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .editor-top{
    display:flex; align-items:center; gap:10px; padding:16px 24px; border-bottom:1px solid var(--outline-var);
  }
  .title-input{
    flex:1; border:none; outline:none; background:transparent; font-family:'Roboto Flex',sans-serif;
    font-variation-settings:'wght' 600, 'opsz' 24; font-size:20px; color:var(--on-surf); min-width:0;
  }
  .title-input::placeholder{ color:var(--on-surf-var); }
  .title-input:disabled{ opacity:.4; }

  .editor-body{ flex:1; overflow:auto; padding:8px 24px 0; display:flex; flex-direction:column; min-height:0; }

  .editor-panes{ flex:1; display:flex; min-height:0; }
  .edit-pane{ display:flex; flex-direction:column; min-width:0; flex:1; }

  #editor{
    flex:1; width:100%; border:none; outline:none; resize:none; background:transparent;
    color:var(--on-surf); font-family:'Inter',sans-serif; font-size:16px; line-height:1.7; padding:16px 0;
  }
  #editor::placeholder{ color:var(--on-surf-var); }
  #editor:disabled{ opacity:.4; }

  .status-bar{
    display:flex; align-items:center; justify-content:space-between; padding:10px 24px 16px;
    font-family:'Roboto Mono',monospace; font-size:11.5px; color:var(--on-surf-var); flex:none;
    border-top:1px solid var(--outline-var);
  }
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:100px; background:var(--surf-c-high); font-size:11px; }

  .empty-editor{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--on-surf-var); text-align:center; padding:40px;
  }
  .empty-editor svg{ width:64px; height:64px; opacity:.5; }
  .empty-editor h2{ margin:0; font-size:18px; color:var(--on-surf); }
  .empty-editor p{ margin:0; font-size:13px; max-width:280px; }

  /* ============ SNACKBAR ============ */
  #snackbar{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px);
    background:var(--on-surf); color:var(--surf); padding:14px 22px; border-radius:var(--r-md);
    font-size:14px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; z-index:50;
    transition: opacity .3s var(--ease-em), transform .3s var(--ease-spring);
  }
  #snackbar.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }

  /* ============ DIALOG ============ */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transition:opacity .25s var(--ease-em); z-index:60;
  }
  .overlay.show{ opacity:1; visibility:visible; }
  .dialog{
    background:var(--surf-c-high); color:var(--on-surf); width:min(360px,86vw); border-radius:var(--r-lg);
    padding:24px; box-shadow:var(--shadow-lg); transform:scale(.9); transition:transform .25s var(--ease-spring);
  }
  .overlay.show .dialog{ transform:scale(1); }
  .dialog h3{ margin:0 0 8px; font-family:'Roboto Flex'; font-variation-settings:'wght' 650; font-size:18px; }
  .dialog p{ margin:0 0 20px; font-size:14px; color:var(--on-surf-var); line-height:1.5; }
  .dialog-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .btn{
    padding:10px 18px; border-radius:var(--r-md); border:none; cursor:pointer; font-size:14px; font-weight:600;
    font-family:'Inter'; transition: border-radius .25s var(--ease-spring), opacity .2s;
  }
  .btn:active{ border-radius:var(--r-xs); }
  .btn-text{ background:transparent; color:var(--on-surf-var); }
  .btn-text:hover{ background:var(--surf-c-highest); }
  .btn-danger{ background:var(--err); color:var(--on-err); }
  .btn-danger:hover{ opacity:.9; }

  input[type="file"]{ display:none; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--outline-var); border-radius:8px; }

  @media (max-width: 820px){
    .editor-top{ padding:14px 16px; flex-wrap:wrap; row-gap:8px; }
    .editor-body{ padding:4px 16px 0; }
    .status-bar{ padding:8px 16px 12px; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="app">
  <!-- EDITOR -->
  <main class="editor-pane">
    <div class="tab-bar" id="tabBar"></div>
    <div class="editor-top">
      <input class="title-input" id="titleInput" placeholder="Bez názvu">
      <button class="icon-btn" id="importTxtBtn" title="Importovať .txt" aria-label="Importovať .txt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="icon-btn" id="downloadTxtBtn" title="Stiahnuť ako TXT" aria-label="Stiahnuť ako TXT">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
    </div>

    <div class="editor-body" id="editorBody">
      <div class="editor-panes" id="editorPanes">
        <div class="edit-pane">
          <textarea id="editor" placeholder="Napíš svoju poznámku…"></textarea>
        </div>
      </div>
      <div class="empty-editor" id="emptyEditor" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3h6l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M14 3v5h5"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <h2>Žiadna karta nie je otvorená</h2>
        <p>Klikni na „+“ vedľa kariet a vytvor si novú, prázdnu poznámku.</p>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <span class="chip" id="wordCountChip">0 slov · 0 znakov</span>
      <span id="savedAt">—</span>
    </div>
  </main>
</div>

<div id="snackbar"></div>

<div class="overlay" id="overlay">
  <div class="dialog" id="dialogBox">
    <h3 id="dialogTitle">Zavrieť kartu?</h3>
    <p id="dialogText">Táto akcia sa nedá vrátiť späť.</p>
    <div class="dialog-actions">
      <button class="btn btn-text" id="dialogCancel">Zrušiť</button>
      <button class="btn btn-danger" id="dialogConfirm">Zavrieť</button>
    </div>
  </div>
</div>

<input type="file" id="fileInputTxt" accept=".txt">

<script>
(function(){
  "use strict";

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const now = () => Date.now();
  function fmtTime(ts){
    if(!ts) return "—";
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,"0");
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}. ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- PERSISTENCE (localStorage) ----------
  // Works when this file is opened directly in a browser. Browser storage APIs are blocked
  // inside Claude.ai's sandboxed artifact preview — download the file and open it locally
  // for saving to actually persist between sessions.
  const STORAGE_KEY = "poznamky-app-v2";
  let storageAvailable = true;
  try{
    window.localStorage.setItem("__probe__","1");
    window.localStorage.removeItem("__probe__");
  }catch(err){ storageAvailable = false; }

  function saveState(){
    if(!storageAvailable) return;
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ notes, openTabs, currentId }));
    }catch(err){ /* quota or blocked — fail silently, in-memory state still works */ }
  }
  function loadState(){
    if(!storageAvailable) return false;
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!Array.isArray(data.notes) || data.notes.length === 0) return false;
      notes = data.notes;
      openTabs = Array.isArray(data.openTabs) && data.openTabs.length ? data.openTabs.filter(id => notes.some(n => n.id === id)) : [notes[0].id];
      if(openTabs.length === 0) openTabs = [notes[0].id];
      currentId = data.currentId && notes.some(n => n.id === data.currentId) ? data.currentId : openTabs[0];
      return true;
    }catch(err){ return false; }
  }

  // ---------- STATE ----------
  let notes = [{ id: uid(), title: "Bez názvu", content: "", updatedAt: now() }];
  let currentId = notes[0].id;
  let openTabs = [notes[0].id];
  let saveTimer = null;
  loadState();

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const tabBar        = $("tabBar");
  const titleInput    = $("titleInput");
  const editor         = $("editor");
  const editorPanes    = $("editorPanes");
  const emptyEditor    = $("emptyEditor");
  const wordChip       = $("wordCountChip");
  const savedAt        = $("savedAt");
  const overlay        = $("overlay");
  const dialogTitle    = $("dialogTitle");
  const dialogText     = $("dialogText");
  const dialogCancel   = $("dialogCancel");
  const dialogConfirm  = $("dialogConfirm");
  const snackbar       = $("snackbar");

  // ---------- THEME (auto, podľa zariadenia) ----------
  const darkMedia = window.matchMedia("(prefers-color-scheme: dark)");
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", darkMedia.matches ? "dark" : "light");
  }
  applyTheme();
  darkMedia.addEventListener("change", applyTheme);

  // ---------- SNACKBAR ----------
  let snackTimer = null;
  function toast(msg){
    snackbar.textContent = msg;
    snackbar.classList.add("show");
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbar.classList.remove("show"), 2400);
  }

  // ---------- DIALOG ----------
  function confirmDialog(title, text, onConfirm){
    dialogTitle.textContent = title;
    dialogText.textContent = text;
    overlay.classList.add("show");
    const cleanup = () => { overlay.classList.remove("show"); dialogConfirm.onclick = null; dialogCancel.onclick = null; };
    dialogConfirm.onclick = () => { cleanup(); onConfirm(); };
    dialogCancel.onclick = cleanup;
  }
  overlay.addEventListener("click", e => { if(e.target === overlay) overlay.classList.remove("show"); });

  function getCurrent(){ return notes.find(n => n.id === currentId); }

  // ---------- TABS ----------
  function renderTabs(){
    tabBar.innerHTML = "";
    openTabs.forEach(id => {
      const n = notes.find(x => x.id === id);
      if(!n) return;
      const tab = document.createElement("div");
      tab.className = "tab" + (id === currentId ? " active" : "");
      tab.title = n.title || "Bez názvu";
      tab.innerHTML = `
        <span class="tab-label">${escapeHtml(n.title || "Bez názvu")}</span>
        <button class="tab-close" aria-label="Zavrieť kartu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>`;
      tab.addEventListener("click", (e) => {
        if(e.target.closest(".tab-close")) return;
        selectNote(id);
      });
      tab.querySelector(".tab-close").addEventListener("click", (e) => {
        e.stopPropagation();
        closeTab(id);
      });
      tabBar.appendChild(tab);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "tab-add";
    addBtn.title = "Nová karta";
    addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    addBtn.addEventListener("click", createNote);
    tabBar.appendChild(addBtn);
  }

  function selectNote(id){
    currentId = id;
    renderTabs();
    renderEditor();
    saveState();
  }

  function createNote(){
    const n = { id: uid(), title: "Bez názvu", content: "", updatedAt: now() };
    notes.push(n);
    openTabs.push(n.id);
    currentId = n.id;
    renderTabs();
    renderEditor();
    saveState();
    titleInput.focus();
    titleInput.select();
  }

  function closeTab(id){
    const n = notes.find(x => x.id === id);
    if(!n) return;
    const hasContent = (n.title && n.title.trim() && n.title !== "Bez názvu") || (n.content && n.content.trim());
    const doClose = () => {
      const idx = openTabs.indexOf(id);
      openTabs = openTabs.filter(x => x !== id);
      notes = notes.filter(x => x.id !== id);
      if(currentId === id){
        currentId = openTabs[idx] || openTabs[idx - 1] || null;
      }
      if(openTabs.length === 0){
        const blank = { id: uid(), title: "Bez názvu", content: "", updatedAt: now() };
        notes.push(blank);
        openTabs.push(blank.id);
        currentId = blank.id;
      }
      renderTabs();
      renderEditor();
      saveState();
    };
    if(hasContent){
      confirmDialog("Zavrieť kartu?", `Poznámka „${n.title || "Bez názvu"}“ bude natrvalo odstránená — karty tu nemajú samostatný zoznam na obnovenie.`, doClose);
    }else{
      doClose();
    }
  }

  titleInput.addEventListener("input", () => {
    const n = getCurrent();
    if(!n) return;
    n.title = titleInput.value;
    n.updatedAt = now();
    renderTabs();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 300);
  });

  // ---------- EDITOR RENDER ----------
  function renderEditor(){
    const n = getCurrent();
    if(!n){
      editorPanes.style.display = "none";
      emptyEditor.style.display = "flex";
      titleInput.value = "";
      titleInput.disabled = true;
      wordChip.textContent = "0 slov · 0 znakov";
      savedAt.textContent = "—";
      return;
    }
    editorPanes.style.display = "flex";
    emptyEditor.style.display = "none";
    titleInput.disabled = false;
    titleInput.value = n.title;
    editor.value = n.content;
    updateStatus(n);
  }

  function updateStatus(n){
    const text = n.content || "";
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    wordChip.textContent = `${words} ${words === 1 ? "slovo" : "slov"} · ${text.length} znakov`;
    savedAt.textContent = "Uložené " + fmtTime(n.updatedAt);
  }

  editor.addEventListener("input", () => {
    const n = getCurrent();
    if(!n) return;
    n.content = editor.value;
    n.updatedAt = now();
    updateStatus(n);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 400);
  });

  // ---------- EXPORT ----------
  function downloadBlob(content, filename, type){
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }
  $("downloadTxtBtn").addEventListener("click", () => {
    const n = getCurrent();
    if(!n) return;
    downloadBlob(n.content, (n.title || "poznamka").replace(/[\\/:*?"<>|]/g,"_") + ".txt", "text/plain;charset=utf-8");
    toast("Poznámka stiahnutá ako .txt");
  });
  // ---------- IMPORT ----------
  $("importTxtBtn").addEventListener("click", () => $("fileInputTxt").click());
  $("fileInputTxt").addEventListener("change", (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(file.size > 2_000_000){ toast("Súbor je príliš veľký (max 2 MB)."); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const n = { id: uid(), title: file.name.replace(/\.txt$/i, ""), content: ev.target.result, updatedAt: now() };
      notes.push(n);
      openTabs.push(n.id);
      currentId = n.id;
      renderTabs(); renderEditor();
      saveState();
      toast("Poznámka importovaná ako nová karta");
    };
    reader.readAsText(file, "UTF-8");
  });

  // ---------- SHORTCUTS ----------
  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase() === "n"){ e.preventDefault(); createNote(); }
    if(mod && e.key.toLowerCase() === "s"){ e.preventDefault(); $("downloadTxtBtn").click(); }
    if(mod && e.key.toLowerCase() === "w" && currentId){ e.preventDefault(); closeTab(currentId); }
  });

  // ---------- INIT ----------
  renderTabs();
  renderEditor();
  if(!storageAvailable){
    toast("Ukladanie do local storage je tu blokované — stiahni si zálohu, aby si o nič neprišiel.");
  }
})();
</script>
</body>
</html>
