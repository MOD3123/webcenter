<html lang="sk">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --md-sys-color-primary: #1B6F3A;
    --md-sys-color-on-primary: #ffffff;
    --md-sys-color-primary-container: #B7F1C9;
    --md-sys-color-on-primary-container: #002111;
    --md-sys-color-secondary: #4E6355;
    --md-sys-color-secondary-container: #D1E8D8;
    --md-sys-color-surface: #F6FBF4;
    --md-sys-color-surface-container: #ECF3EA;
    --md-sys-color-surface-container-high: #E1EBE0;
    --md-sys-color-on-surface: #1A1C1A;
    --md-sys-color-on-surface-variant: #3F4F42;
    --md-sys-color-outline: #6F7F6E;
    --md-sys-color-outline-variant: #BDC9BB;
    --md-sys-color-error: #BA1A1A;
    --bio: #6D3B00;
    --bio-container: #FFDCBE;
    --papier: #0054A2;
    --papier-container: #D4E3FF;
    --plasty: #815600;
    --plasty-container: #FFDDB3;
    --komunalny: #3D3D3D;
    --komunalny-container: #E6E6E6;
    --shadow: 0 2px 8px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.13), 0 2px 4px rgba(0,0,0,0.07);
    --radius: 16px;
    --radius-sm: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --md-sys-color-primary: #8DD9A6;
      --md-sys-color-on-primary: #003919;
      --md-sys-color-primary-container: #00532A;
      --md-sys-color-on-primary-container: #B7F1C9;
      --md-sys-color-secondary: #B5CCBA;
      --md-sys-color-secondary-container: #384B3E;
      --md-sys-color-surface: #1A1C1A;
      --md-sys-color-surface-container: #1E201E;
      --md-sys-color-surface-container-high: #282B28;
      --md-sys-color-on-surface: #E2E3DF;
      --md-sys-color-on-surface-variant: #BEC9BC;
      --md-sys-color-outline: #889587;
      --md-sys-color-outline-variant: #3F4F42;
      --bio: #FFBA7A;
      --bio-container: #3D2000;
      --papier: #A6C8FF;
      --papier-container: #003060;
      --plasty: #FFB870;
      --plasty-container: #3E2900;
      --komunalny: #C6C6C6;
      --komunalny-container: #282828;
      --shadow: 0 2px 8px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background-color: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    min-height: 100vh;
    padding: 0 0 60px;
    transition: background-color 0.3s, color 0.3s;
  }

  /* HEADER */
  header {
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    padding: 28px 24px 24px;
    border-radius: 0 0 28px 28px;
    margin-bottom: 32px;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '🗑';
    position: absolute;
    left: -14px; bottom: -18px;
    font-size: 110px;
    opacity: 0.10;
    line-height: 1;
    pointer-events: none;
  }
  header::after {
    content: '♻';
    position: absolute;
    right: -10px; top: -20px;
    font-size: 120px;
    opacity: 0.10;
    line-height: 1;
    pointer-events: none;
  }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    line-height: 1.1;
    letter-spacing: -0.5px;
    text-align: center;
  }
  header p {
    margin-top: 6px;
    font-size: 0.95rem;
    opacity: 0.85;
    font-weight: 600;
    text-align: center;
  }

  /* LEGEND */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px;
    margin-bottom: 28px;
    justify-content: center;
  }
  .legend-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 0.8rem;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    box-shadow: var(--shadow);
  }
  .legend-chip.komunalny { background: var(--komunalny-container); color: var(--komunalny); }
  .legend-chip.plasty    { background: var(--plasty-container); color: var(--plasty); }
  .legend-chip.papier    { background: var(--papier-container); color: var(--papier); }
  .legend-chip.bio       { background: var(--bio-container); color: var(--bio); }

  /* CALENDAR GRID */
  .calendar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 14px;
    padding: 0 12px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .month-card {
    background: var(--md-sys-color-surface-container);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
    min-width: 0;
  }
  .month-card:hover { box-shadow: var(--shadow-md); }
  .month-card h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1rem;
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    padding: 12px 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .month-card ul { list-style: none; padding: 6px 0; }
  .month-card li {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    font-size: 0.88rem;
    transition: background 0.15s;
  }
  .month-card li:last-child { border-bottom: none; }
  .month-card li:hover { background: var(--md-sys-color-surface-container-high); }
  .month-card li.today-item {
    background: var(--md-sys-color-primary-container);
    font-weight: 700;
  }

  .date-badge {
    background: var(--md-sys-color-surface-container-high);
    border-radius: 8px;
    padding: 3px 8px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    min-width: 60px;
    text-align: center;
    color: var(--md-sys-color-on-surface);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .type-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 8px;
    padding: 3px 10px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .type-chip.komunalny { background: var(--komunalny-container); color: var(--komunalny); }
  .type-chip.plasty    { background: var(--plasty-container); color: var(--plasty); }
  .type-chip.papier    { background: var(--papier-container); color: var(--papier); }
  .type-chip.bio       { background: var(--bio-container); color: var(--bio); }

  /* INFO SECTION */
  .info-section {
    max-width: 1100px;
    margin: 40px auto 0;
    padding: 0 12px;
  }
  .info-section > h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--md-sys-color-primary);
    margin-bottom: 16px;
    padding-left: 4px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
    gap: 14px;
  }
  .info-card {
    background: var(--md-sys-color-surface-container);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .info-card:hover { box-shadow: var(--shadow-md); }
  .info-card-header {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .info-card-header .icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .info-card-header h3 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 0.95rem;
    letter-spacing: 0.3px;
  }
  .info-card.komunalny .info-card-header { background: var(--komunalny-container); color: var(--komunalny); }
  .info-card.plasty    .info-card-header { background: var(--plasty-container); color: var(--plasty); }
  .info-card.papier    .info-card-header { background: var(--papier-container); color: var(--papier); }
  .info-card.bio       .info-card-header { background: var(--bio-container); color: var(--bio); }

  .info-card-body { padding: 14px 16px; font-size: 0.83rem; line-height: 1.55; }
  .info-card-body strong { font-weight: 700; color: var(--md-sys-color-primary); }
  .info-card-body .no { color: var(--md-sys-color-error); font-weight: 600; }
  .info-card-body .yes { color: var(--md-sys-color-primary); font-weight: 600; }

  .separator { margin: 10px 0 6px; border-top: 1px solid var(--md-sys-color-outline-variant); padding-top: 8px; }
</style>
</head>

const monthNames = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const dayNames = ['Ne','Po','Ut','St','Št','Pi','So'];

function renderCalendar() {
  const today = new Date();
  today.setHours(0,0,0,0);

  const months = {};
  schedule.forEach(e => {
    const d = new Date(e.date);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if (!months[key]) months[key] = { year: d.getFullYear(), month: d.getMonth(), items: [] };
    months[key].items.push(e);
  });

  const cal = document.getElementById('calendar');
  Object.values(months).forEach(m => {
    // Filter out past dates
    const visibleItems = m.items.filter(e => new Date(e.date) >= today);
    if (visibleItems.length === 0) return; // skip fully past months

    const items = visibleItems.map(e => {
      const d = new Date(e.date);
      const isToday = d.getTime() === today.getTime();
      const day = dayNames[d.getDay()];
      const dd = String(d.getDate()).padStart(2,'0');
      return `<li class="${isToday ? 'today-item' : ''}">
        <span class="date-badge">${day} ${dd}.</span>
        <span class="type-chip ${e.cls}">${e.cls === 'komunalny' ? '🗑' : e.cls === 'plasty' ? '🧴' : e.cls === 'papier' ? '📄' : '🌿'} ${e.type}</span>
        ${isToday ? '<span style="margin-left:auto;font-size:0.75rem;font-weight:900;color:var(--md-sys-color-primary)">DNES</span>' : ''}
      </li>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'month-card';
    card.innerHTML = `<h2>${monthNames[m.month]} ${m.year}</h2><ul>${items}</ul>`;
    cal.appendChild(card);
  });
}

    grid.appendChild(card);

}
